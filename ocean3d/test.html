<!doctype html>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>洋流的动力密码 · 海洋水交互演示</title>
<style>
:root{
  --bg:#04080e; --line:rgba(120,200,230,.14); --txt:#d6ecf5; --dim:#86a7b8;
  --amber:#f2a24a; --amber-l:#ffd7a8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:var(--txt);-webkit-font-smoothing:antialiased;user-select:none}
#c,#flatmap,#monsoon{position:fixed;inset:0;display:block;touch-action:none}
#flatmap{display:none;z-index:1}
body.flat #c{display:none}
body.flat #flatmap{display:block}
body.flat #labels{display:none}
#monsoon{display:none;z-index:1}
body.msn #c{display:none}
body.msn #monsoon{display:block}
body.msn #labels{display:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}

#top{position:fixed;left:34px;top:28px;z-index:6;pointer-events:none}
#top .kicker{font-size:10px;letter-spacing:.34em;color:var(--amber);opacity:.9;margin-bottom:9px}
#top h1{font-size:27px;font-weight:500;letter-spacing:.10em;line-height:1.2}
#top p{font-size:11.5px;letter-spacing:.16em;color:var(--dim);margin-top:8px}

#modebar{position:fixed;left:34px;top:50%;transform:translateY(-34%);z-index:6;
  display:flex;flex-direction:column;gap:8px}
.mode{width:200px;text-align:left;padding:11px 14px;border-radius:12px;cursor:pointer;
  background:rgba(9,20,30,.5);border:1px solid var(--line);color:var(--txt);
  display:grid;grid-template-columns:24px 1fr;grid-template-rows:auto auto;gap:1px 6px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.25s;font-family:inherit}
.mode i{grid-row:1/3;font-style:normal;font-size:9.5px;color:var(--dim);align-self:center;letter-spacing:.1em}
.mode b{font-size:13.5px;font-weight:500;letter-spacing:.06em}
.mode span{font-size:10px;color:var(--dim);letter-spacing:.06em}
.mode:hover{border-color:rgba(242,162,74,.4)}
.mode.on{background:linear-gradient(90deg,rgba(242,162,74,.16),rgba(9,20,30,.55));
  border-color:rgba(242,162,74,.55);box-shadow:0 0 24px rgba(242,162,74,.08)}
.mode.on b{color:var(--amber-l)}
.mode.on i{color:var(--amber)}

#panel{position:fixed;right:34px;top:92px;width:292px;z-index:6;padding:0;border-radius:16px;
  max-height:calc(100vh - 210px);display:flex;flex-direction:column;
  background:rgba(8,17,26,.62);border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
#pbody{padding:16px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(140,190,215,.28) transparent}
#pbody::-webkit-scrollbar{width:6px;height:6px}
#pbody::-webkit-scrollbar-thumb{background:rgba(140,190,215,.26);border-radius:3px}
#pbody::-webkit-scrollbar-track{background:transparent}
.phandle{display:none}
.phead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.phead h3{font-size:14px;font-weight:500;letter-spacing:.10em}
.psub{font-size:10.5px;color:rgba(242,178,106,.86);letter-spacing:.08em;margin:-2px 0 10px;
  padding-left:8px;border-left:2px solid rgba(242,162,74,.45)}
.phint{font-size:9.5px;color:var(--dim);letter-spacing:.1em}

.ctl{margin-bottom:13px}
.ctl-top{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:7px;letter-spacing:.04em}
.ctl-val{color:var(--amber-l);font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;
  font-size:11px;color:var(--dim);letter-spacing:.04em}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
  background:rgba(140,200,220,.22);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#ffc078;box-shadow:0 0 10px rgba(255,192,120,.55)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:#ffc078}

.sw{width:40px;height:21px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);position:relative;cursor:pointer;transition:.22s;flex:none}
.sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#8fb4c4;transition:.22s}
.sw.on{background:rgba(242,162,74,.26);border-color:rgba(242,162,74,.6)}
.sw.on i{left:21px;background:#ffc078}

.seg{display:flex;gap:5px;margin-top:7px}
.segrow{display:flex;flex-wrap:wrap;gap:6px;margin:2px auto 4px;max-width:230px;justify-content:center}
.segrow .segbtn{flex:0 0 auto;min-width:98px;padding:7px 10px;text-align:center}
.segbtn{flex:1;padding:7px 3px;font-size:10.5px;color:var(--dim);cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;transition:.18s}
.segbtn:hover{color:var(--txt)}
.segbtn.on{background:rgba(242,162,74,.16);border-color:rgba(242,162,74,.5);color:var(--amber-l)}
.seg.locked .segbtn{cursor:not-allowed}
.seg.locked .segbtn.off{opacity:.42}
.seg.locked .segbtn.off:hover{color:var(--dim)}
.lockhint{font-size:9.5px;color:rgba(242,178,106,.7);letter-spacing:.04em;margin:-7px 0 12px}
#pbody{scrollbar-gutter:stable both-edges}

.note{font-size:10px;line-height:1.75;color:var(--dim);border-left:2px solid rgba(242,162,74,.38);
  padding-left:9px;margin-top:14px;letter-spacing:.02em}
.links{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.links .ctl-label{font-size:10px;color:var(--dim);letter-spacing:.06em}
.linkbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.link{font-size:10.5px;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);transition:.18s}
.link:hover{border-color:rgba(242,162,74,.6);color:var(--amber-l)}

.gauge{margin:2px 0 13px;font-size:10px;color:var(--dim);letter-spacing:.04em}
.bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,#f2a24a,#ffd7a8);transition:width .25s}
.bar.cold i{background:linear-gradient(90deg,#2f86c9,#8fe0ff)}

.legend{margin-top:8px;font-size:10px;color:var(--dim);display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle}
.legend .sep{grid-column:1/3;height:1px;background:var(--line);margin:5px 0}
/* 季风面板：三条图例并排放一行 */
/* 转盘：最朴素的分块布局——外层 100% 宽、text-align:center，画布 inline-block 居中 */
.wheelbox{display:block;width:100%;margin:20px 0 16px;padding:0;text-align:center;
  clear:both;line-height:0;touch-action:pan-y}
.wheelbox .wheelcv{position:static;inset:auto;display:inline-block;width:206px;height:206px;
  vertical-align:top;margin:0 auto;touch-action:pan-y;cursor:grab}
.wheelbox.grab .wheelcv{cursor:grabbing}

.legend.oneline{display:flex;flex-wrap:nowrap;justify-content:center;gap:12px;align-items:center}
.legend.oneline .sep{display:none}
/* 图例下面的开关行留出呼吸感 */
.legend + .ctl.row{margin-top:12px}
.legend.oneline.tight{gap:9px;font-size:9.5px}
.legend.oneline.tight i{width:6px;height:6px;margin-right:4px}

#dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:6;
  width:min(680px,calc(100% - 700px));min-width:300px;text-align:center}
#chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chip{font-size:10px;padding:4px 10px;border-radius:999px;color:#cfe6f2;letter-spacing:.03em;
  background:rgba(8,18,28,.6);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip em{font-style:normal;color:var(--dim);margin-right:6px}
#caption{font-size:12.5px;line-height:1.8;color:#d9eef7;padding:11px 18px;border-radius:12px;
  background:rgba(8,18,28,.55);border:1px solid var(--line);letter-spacing:.03em;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s}

#card{position:fixed;left:auto;right:34px;bottom:96px;width:290px;z-index:7;padding:0;border-radius:14px;
  background:rgba(10,22,32,.82);border:1px solid var(--line);overflow:hidden;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:.3s}
#card.show{opacity:1;transform:none;pointer-events:auto}
.cmini{display:flex;align-items:center;gap:8px;padding:11px 13px;cursor:pointer}
.cmini b{font-size:12.5px;font-weight:500;flex:1;letter-spacing:.04em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cmini em{font-style:normal;font-size:9.5px;color:var(--dim);letter-spacing:.05em;white-space:nowrap}
.cmini .ctog{background:none;border:none;color:var(--dim);cursor:pointer;font-size:10px;
  line-height:1;padding:2px;transition:transform .25s}
#card.open .cmini .ctog{transform:rotate(180deg)}
.cbody{display:none;padding:0 14px 14px}
#card.open .cbody{display:block}
.card-top{display:flex;align-items:center;gap:8px}
.card-top h4{font-size:13.5px;font-weight:500;flex:1;letter-spacing:.05em}
.card-top .dot{width:7px;height:7px;border-radius:50%;flex:none}
.card-top .x{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;line-height:1}
.badges{display:flex;gap:6px;margin:11px 0 10px}
.badge{font-size:9.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);letter-spacing:.06em}
.why{font-size:11px;line-height:1.8;color:#cfe6f2}
.eff{font-size:10.5px;line-height:1.75;color:var(--dim);margin-top:9px}
.go{margin-top:13px;width:100%;padding:9px;border-radius:9px;cursor:pointer;font-family:inherit;
  border:1px solid rgba(242,162,74,.5);background:rgba(242,162,74,.13);color:var(--amber-l);
  font-size:11px;letter-spacing:.1em;transition:.2s}
.go:hover{background:rgba(242,162,74,.22)}

.lab{position:absolute;left:0;top:0;font-size:10.5px;letter-spacing:.09em;color:#bfe3f2;
  white-space:nowrap;pointer-events:none;transition:opacity .25s;will-change:transform;
  text-shadow:0 0 14px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9)}
.lab.dim{color:#7fa3b4;font-size:9.5px;letter-spacing:.16em}
.lab.accent{color:#eaf8ff}
.lab.amber{color:#f2b26a}
.lab.cyan{color:#8fe0ff}
.lab.green{color:#8fe0a8}
.lab.red{color:#ff9b8a}

#rotate{display:none;margin-bottom:7px;font-size:10px;letter-spacing:.06em;
  color:#f2b26a;background:rgba(242,162,74,.12);border:1px solid rgba(242,162,74,.42);
  border-radius:999px;padding:4px 12px;pointer-events:none}
@media (max-width:980px) and (orientation:portrait){ #rotate{display:inline-block} }
#fs{position:fixed;z-index:8;right:34px;bottom:58px;width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;cursor:pointer;
  color:#bfe3f2;font-family:inherit;background:rgba(8,17,26,.72);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#fs:hover{color:#ffd0a0;border-color:rgba(242,162,74,.5)}
@media (max-width:980px) and (orientation:portrait){
  #fs{right:12px;bottom:118px;width:32px;height:32px;font-size:14px}
}
@media (orientation:landscape) and (max-height:560px) and (max-width:1100px){
  #fs{left:12px;bottom:12px;right:auto;width:30px;height:30px;font-size:13px}
}
#tip{position:fixed;right:34px;bottom:30px;z-index:6;font-size:9.5px;color:#5d7d8f;letter-spacing:.18em}

#boot{position:fixed;inset:0;z-index:50;background:#04080e;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;color:#7fa3b4;font-size:11px;letter-spacing:.26em;
  transition:opacity .8s}
#boot.gone{opacity:0;pointer-events:none}
.ring{width:44px;height:44px;border-radius:50%;border:1px solid rgba(120,200,230,.18);
  border-top-color:#ffc078;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1180px){
  #dock{width:min(560px,calc(100% - 620px))}
}
@media (max-width:980px){
  #top{left:16px;top:14px}
  #top h1{font-size:19px}
  #top p{display:none}
  #top .kicker{font-size:9px}
  #modebar{left:0;right:0;top:70px;bottom:auto;transform:none;flex-direction:row;gap:4px;
    padding:0 8px 2px;flex-wrap:nowrap;overflow:hidden}
  .mode{width:auto;flex:1 1 0;min-width:0;padding:7px 4px;grid-template-columns:1fr;
    text-align:center;gap:1px;border-radius:10px;overflow:hidden}
  .mode i{display:none}
  .mode b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mode span{font-size:8.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

  /* 底部抽屉 */
  #panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:none;border-radius:18px 18px 0 0;
    border-left:none;border-right:none;border-bottom:none;z-index:12;
    transform:translateY(calc(100% - 58px));transition:transform .3s cubic-bezier(.22,.61,.36,1)}
  #panel.open{transform:translateY(0)}
  .phead{justify-content:space-between;margin-bottom:6px}
  .phandle b{display:none}
  .phandle{display:flex;height:58px;flex:none;align-items:center;justify-content:space-between;
    padding:0 18px;cursor:grab;touch-action:none;position:relative}
  .phandle .grab{position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:40px;height:4px;border-radius:2px;background:rgba(160,200,220,.35);
    cursor:grab;touch-action:none}
  .phandle span{font-size:9.5px;color:var(--dim);letter-spacing:.08em;margin-top:6px}
  .phandle .chev{transition:transform .3s;cursor:pointer;padding:0 10px;line-height:1}
  #panel.open .phandle .chev{transform:rotate(180deg)}
  #pbody{padding:2px 18px 26px;max-height:calc(74vh - 58px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}

  #dock{width:calc(100% - 28px);bottom:auto;top:auto;left:14px;right:14px;transform:none;
    position:fixed;bottom:74px}
  #caption{font-size:10.5px;padding:8px 12px;line-height:1.65;max-height:76px;overflow:hidden}
  #chips{display:none}
  #card{left:12px;right:12px;width:auto;bottom:74px;top:auto}
  #tip{display:none}
  .lab{font-size:9.5px}
}
@media (max-width:980px) and (max-height:520px){
  #panel{transform:translateY(calc(100% - 46px))}
  .phandle{height:46px}
  #pbody{max-height:calc(100vh - 100px)}
}


/* ---- 手机横屏：面板移到右侧，顶栏压扁，把画面让给地图 ---- */
@media (orientation:landscape) and (max-height:560px) and (max-width:1100px){
  #top{display:none}
  #modebar{left:10px;right:auto;top:8px;bottom:auto;transform:none;flex-direction:row;gap:4px;
    padding:0;flex-wrap:nowrap;max-width:calc(56% - 12px);overflow:hidden}
  .mode{width:auto;flex:0 0 auto;padding:5px 9px;grid-template-columns:1fr;text-align:center;gap:0;
    border-radius:9px}
  .mode i,.mode span{display:none}
  .mode b{font-size:10px}
  #panel{left:auto;right:10px;top:8px;bottom:10px;width:clamp(260px,40vw,360px);max-height:none;
    transform:translateX(0);border-radius:14px;z-index:12;display:flex;flex-direction:row;
    overflow:hidden;transition:transform .28s cubic-bezier(.22,.61,.36,1)}
  /* 手柄：和竖屏一样是面板内部的一条，只是竖屏在顶部、横屏在左侧 */
  .phandle{display:flex !important;position:static;order:-1;flex:0 0 26px;width:26px;height:auto;
    flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0;
    background:transparent;border:none;border-radius:0;cursor:grab;touch-action:none}
  .phandle .grab{position:static;width:6px;height:44px;border-radius:3px;
    background:rgba(160,200,220,.34);transform:none;top:auto;left:auto}
  .phandle b{display:none}
  .phandle .chev{margin:0;transform:rotate(90deg) !important}
  body.pmin .phandle .chev{transform:rotate(-90deg) !important}
  #panel.open{transform:translateX(0)}
  body.pmin #panel{transform:translateX(calc(100% - 26px)) !important}
  #pbody{padding:12px 14px 18px;max-height:none;flex:1 1 auto;min-width:0;overflow-y:auto}
  .phead{margin-bottom:8px}
  .phead h3{display:block;font-size:12.5px}
  .phint{font-size:9px}
  #dock{left:10px;right:auto;width:calc(60% - 20px);bottom:8px;transform:none;text-align:left}
  #caption{font-size:9.5px;padding:6px 10px;max-height:48px;line-height:1.5}
  #rotate{display:none !important}
  .wheelbox{margin:6px 0 4px}
  .note{font-size:9px;margin-top:8px}
  /* 季风：横屏时把四个月份按钮并成一行，整面板不需要滚动 */
  body.msn .segrow{flex-wrap:nowrap;max-width:none;width:100%;margin:2px 0 4px;gap:4px}
  body.msn .segrow .segbtn{flex:1 1 0;min-width:0;padding:6px 2px;font-size:9.5px;text-align:center}
  body.msn .note{display:none}
  body.msn .links .linkbox{flex-wrap:nowrap;gap:5px}
  body.msn .links .link{flex:1 1 0;min-width:0;padding:5px 4px;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.msn .links{margin-top:6px;padding-top:8px}
  body.msn #pbody{overflow:hidden}
}
/* 很矮的手机（竖屏）：季风面板把图例和注释隐去，保证不出现滚动 */
@media (max-width:980px) and (max-height:700px){
  body.msn .note, body.msn .legend.oneline{display:none}
  body.msn .segrow{margin:2px 0 6px}
  /* 面板内不再出现滚动条 */
  #pbody{scrollbar-width:none;-ms-overflow-style:none}
  #pbody::-webkit-scrollbar{width:0;height:0}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="flatmap"></canvas>
<canvas id="monsoon"></canvas>
<div id="labels"></div>

<header id="top">
  <div class="kicker">AI 地理实验室 · 主题 8 海洋水</div>
  <h1>洋流的动力密码</h1>
  <p>洋流 · 季风洋流　成因演示实验</p>
</header>

<nav id="modebar"></nav>
<aside id="panel"></aside>

<div id="dock">
  <div id="rotate">↻ 手机横屏 + 全屏观看，地图与转盘更完整</div>
  <div id="chips"></div>
  <div id="caption"></div>
</div>

<div id="card"></div>
<button id="fs" title="全屏 / 退出全屏">⛶</button>
<div id="tip">拖拽旋转 · 滚轮缩放 · 点击洋流</div>

<div id="boot"><div class="ring"></div><span>正在生成海洋</span></div>

<script>
console.warn('Scripts "build/three.js" and "build/three.min.js" are deprecated with r150+, and will be removed with r160. Please use ES Modules or alternatives: https://threejs.org/docs/index.html#manual/en/introduction/Installation'),
/**

<script>
/* ============ core：渲染器 / 相机 / 标签 / 箭头 / 通用工具 ============ */
const APP = (window.APP = {});
(function () {
  const T = THREE;

  APP.S = {
    mode: 'globe',
    wind: 8, rot: 1, hemi: 1,
    sal: 2, sill: -22,
    offshore: 9, elnino: false, compKind: 'v',
    gview: 'globe', overlay: false, month: 7.5,
    forces: true,
    globeColor: 'type',
    filter: 'all',
    sel: null, selIds: null,
    t: 0, speed: 1, playing: true
  };

  APP.C = {
    wind: 0xf2a24a,
    dens: 0xb46cf0,
    comp: 0x35d0a0,
    warm: 0xff7a59,
    cold: 0x4fc3ff,
    cyan: 0x62d6f0,
    amber: 0xffb15c
  };

  APP.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  APP.lerp = (a, b, t) => a + (b - a) * t;
  APP.labels = [];
  APP.scenes = {};

  // 四大渔场（平面地图与 3D 地球共用一套坐标与文案）
  APP.FISHERIES = [
    { lon: -52, lat: 45, t: '纽芬兰渔场', s: '拉布拉多寒流与墨西哥湾暖流交汇', side: 1, oy: -8 },
    { lon: 3, lat: 57, t: '北海渔场', s: '北大西洋暖流与北冰洋南下冷水交汇', side: 1, oy: -10 },
    { lon: 145, lat: 42, t: '北海道渔场', s: '日本暖流与千岛寒流交汇', side: 1, oy: 12 },
    { lon: -79, lat: -10, t: '秘鲁渔场', s: '上升流把营养盐带到表层', side: -1, oy: -14 }
  ];

  /* ---------------- 季风季节：月份 ↔ 季风 ↔ 环流方向（唯一口径） ----------------
     课本：5—9月盛行西南季风，洋流顺时针，7、8月最典型；
           10月至来年3、4月盛行东北季风，洋流逆时针，12月、1月最明显。
     这里把 4 月、10 月定为转换期，其余月份归入夏、冬两季，避免各处阈值打架。 */
  // 以下都用「月份的连续值」表示：1 = 1月1日，4.5 = 4月16日，13 = 次年1月
  // 转换期长度拉到 1.5 个月：3月下旬—5月上旬、9月下旬—11月上旬
  APP.TRANS = 1.5;
  APP.SPRING0 = 3.75;      // 春季转向：3月下旬开始
  APP.AUTUMN0 = 9.75;      // 秋季转向：9月下旬开始

  APP.seasonK = function (m) {
    const M = (((m - 1) % 12) + 12) % 12 + 1;          // 1..13，按月份连续值
    const S0 = APP.SPRING0, A0 = APP.AUTUMN0, L = APP.TRANS;
    if (M >= S0 + L && M < A0) return 1;                     // 5月上旬—9月下旬：西南季风
    if (M >= A0 + L || M < S0) return -1;                    // 11月上旬—3月下旬：东北季风
    if (M >= A0) return Math.cos(Math.PI * (M - A0) / L);    // 夏 → 冬
    return -Math.cos(Math.PI * (M - S0) / L);                // 冬 → 夏
  };

  APP.seasonInfo = function (m) {
    const S0 = APP.SPRING0, A0 = APP.AUTUMN0, L = APP.TRANS;
    const t = (((m - 1) % 12) + 12) % 12;
    const M = t + 1;                                   // 月份连续值
    const k = APP.seasonK(m);
    const mth = Math.max(1, Math.min(12, Math.floor(m + 1e-6)));
    const day = Math.max(1, Math.min(30, Math.floor((m - Math.floor(m + 1e-6)) * 30) + 1));
    let phase, cn, wind, dir, tint;
    if (M >= S0 && M < S0 + L) { phase = 'transition'; cn = '转换期'; wind = '东北季风 → 西南季风'; dir = '环流最弱'; tint = '#b9cdd9'; }
    else if (M >= A0 && M < A0 + L) { phase = 'transition'; cn = '转换期'; wind = '西南季风 → 东北季风'; dir = '环流最弱'; tint = '#b9cdd9'; }
    else if (M >= S0 + L && M < A0) { phase = 'summer'; cn = '夏季'; wind = '西南季风'; dir = '顺时针'; tint = '#ff9d6e'; }
    else { phase = 'winter'; cn = '冬季'; wind = '东北季风'; dir = '逆时针'; tint = '#7cc8ff'; }
    return { k, t, phase, cn, wind, dir, date: mth + '月' + day + '日', tint };
  };

  /* ---------------- renderer ---------------- */
  const canvas = document.getElementById('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  APP.renderer = renderer;

  const scene = (APP.scene = new T.Scene());
  scene.fog = new T.FogExp2(0x04080e, 0.0058);

  const camera = (APP.camera = new T.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 4000));

  /* ---------------- 背景 ---------------- */
  const bg = new T.Mesh(
    new T.SphereGeometry(1600, 32, 16),
    new T.ShaderMaterial({
      side: T.BackSide, depthWrite: false, fog: false,
      uniforms: { uTop: { value: new T.Color(0x0a2334) }, uBot: { value: new T.Color(0x010306) } },
      vertexShader: 'varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 uTop; uniform vec3 uBot; varying vec3 vP;\n' +
        'void main(){ float h=normalize(vP).y*0.5+0.5; vec3 c=mix(uBot,uTop,pow(h,1.35)); gl_FragColor=vec4(c,1.0); }'
    })
  );
  bg.renderOrder = -100;
  scene.add(bg);

  /* ---------------- 灯光 ---------------- */
  scene.add(new T.HemisphereLight(0x9fdcff, 0x02060c, 1.5));
  const dir = new T.DirectionalLight(0xffe2bd, 2.4);
  dir.position.set(-40, 70, 50);
  scene.add(dir);
  const fill = new T.DirectionalLight(0x9fd8ff, 1.5);
  fill.position.set(60, 30, 80);
  scene.add(fill);

  /* ---------------- 视角控制 ---------------- */
  const VIEWS = {
    wind:  { theta: 0.05, phi: 0.84, radius: 196, target: [8, -25, 0], min: 80, max: 300, range: null, phiMin: 0.25, phiMax: 2.35 },
    dens:  { theta: 0.14, phi: 0.90, radius: 188, pfit: 0.95, target: [4, -26, 0], min: 90, max: 280, range: 0.45, phiMin: 0.25, phiMax: 2.35 },
    comp:  { theta: 0.10, phi: 1.20, radius: 176, pfit: 0.95, target: [2, -7, 0], min: 80, max: 300, range: 0.45, phiMin: 0.25, phiMax: 2.5 },
    comph: { theta: 0.10, phi: 0.98, radius: 152, target: [4, 0, 0], min: 70, max: 220, range: 0.6, phiMin: 0.3, phiMax: 2.4 },
    map:   { theta: 0, phi: 1.2, radius: 60, target: [0, 0, 0], min: 30, max: 120, range: null },
    globe: { theta: 0.55, phi: 1.34, radius: 4.35, target: [0.06, 0.02, 0], min: 1.85, max: 7.5, range: null, phiMin: 0.12, phiMax: 3.02 }
  };
  APP.VIEWS = VIEWS;

  const view = {
    theta: VIEWS.globe.theta, phi: VIEWS.globe.phi, radius: VIEWS.globe.radius,
    target: new T.Vector3(...VIEWS.globe.target)
  };
  const viewT = {
    theta: view.theta, phi: view.phi, radius: view.radius,
    target: view.target.clone()
  };
  APP.viewT = viewT;

  APP.goView = function (mode, instant) {
    const v = VIEWS[mode];
    viewT.theta = v.theta; viewT.phi = v.phi; viewT.radius = v.radius;
    viewT.target.set(v.target[0], v.target[1], v.target[2]);
    viewT.pfit = v.pfit || 0;
    if (instant) {
      view.theta = v.theta; view.phi = v.phi; view.radius = v.radius;
      view.target.copy(viewT.target);
      APP.updateCamera();
    }
  };

  APP.fitScale = function () {
    const w = window.innerWidth, h = window.innerHeight;
    const r = w / h;
    if (r >= 1.35) return 1;
    return Math.min(1.5, 1.35 / Math.max(0.55, r));   // 别把场景拉得太远
  };

  APP.updateCamera = function () {
    view.theta += (viewT.theta - view.theta) * 0.16;
    view.phi += (viewT.phi - view.phi) * 0.16;
    view.radius += (viewT.radius - view.radius) * 0.14;
    view.target.lerp(viewT.target, 0.12);
    // 竖屏：这几个横向很扁的场景单独放大，否则画面只剩中间一条带
    const portrait = innerWidth / innerHeight < 0.85;
    const f = (portrait && viewT.pfit) ? viewT.pfit : APP.fitScale();
    const R = view.radius * f;
    camera.position.set(
      view.target.x + R * Math.sin(view.phi) * Math.sin(view.theta),
      view.target.y + R * Math.cos(view.phi),
      view.target.z + R * Math.sin(view.phi) * Math.cos(view.theta)
    );
    camera.lookAt(view.target);
  };

  /* ---------------- 指针 ---------------- */
  let dragging = false, px = 0, py = 0, moved = 0;

  // 双指缩放（手机）
  const touches = new Map();
  let pinchDist = 0;
  canvas.addEventListener('pointerdown', (e) => {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
      dragging = false;
      return;
    }
    dragging = true; px = e.clientX; py = e.clientY; moved = 0;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const [a, b] = [...touches.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0 && d > 0) {
        const v = VIEWS[APP.S.mode];
        viewT.radius = APP.clamp(viewT.radius * (pinchDist / d), v.min, v.max);
      }
      pinchDist = d;
      return;
    }
    if (!dragging) { if (APP.onHover) APP.onHover(e); return; }
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    const v = VIEWS[APP.S.mode];
    viewT.theta -= dx * 0.0062;
    viewT.phi = APP.clamp(viewT.phi - dy * 0.0048, v.phiMin != null ? v.phiMin : 0.2, v.phiMax != null ? v.phiMax : 1.6);
    if (v.range != null) viewT.theta = APP.clamp(viewT.theta, -v.range, v.range);
  });
  canvas.addEventListener('pointerup', (e) => {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinchDist = 0;
    dragging = false;
    if (moved < 7 && touches.size === 0 && APP.onPick) APP.onPick(e);
  });
  canvas.addEventListener('pointercancel', (e) => {
    touches.delete(e.pointerId);
    if (touches.size < 2) pinchDist = 0;
    dragging = false;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = VIEWS[APP.S.mode];
    viewT.radius = APP.clamp(viewT.radius * (1 + e.deltaY * 0.0011), v.min, v.max);
  }, { passive: false });

  /* ---------------- 标签 ---------------- */
  const labelLayer = document.getElementById('labels');
  APP.label = function (text, cls) {
    const el = document.createElement('div');
    el.className = 'lab' + (cls ? ' ' + cls : '');
    el.textContent = text;
    labelLayer.appendChild(el);
    const o = { el, pos: new T.Vector3(), on: true, w: 0, mode: APP.curMode };
    APP.labels.push(o);
    return o;
  };
  const _v = new T.Vector3();
  APP.updateLabels = function () {
    const W = window.innerWidth, H = window.innerHeight;
    for (let i = 0; i < APP.labels.length; i++) {
      const L = APP.labels[i];
      if (!L.on || (L.mode && L.mode !== APP.S.mode) || (L.kind && L.kind !== APP.S.compKind)) { if (L.el.style.opacity !== '0') L.el.style.opacity = '0'; continue; }
      _v.copy(L.pos).project(camera);
      if (_v.z > 1 || _v.z < -1 || Math.abs(_v.x) > 1.3 || Math.abs(_v.y) > 1.25) {
        L.el.style.opacity = '0'; continue;
      }
      L.el.style.opacity = '1';
      const ox = L.off ? L.off[0] : 0, oy = L.off ? L.off[1] : 0;
      L.el.style.transform = 'translate(-50%,-50%) translate(' + (((_v.x * 0.5 + 0.5) * W) + ox).toFixed(1) + 'px,' + (((-_v.y * 0.5 + 0.5) * H) + oy).toFixed(1) + 'px)';
    }
  };

  /* ---------------- 箭头 ---------------- */
  const UP = new T.Vector3(0, 1, 0);
  APP.arrow = function (color, opts) {
    opts = opts || {};
    const mat = new T.MeshBasicMaterial({
      color, transparent: true, opacity: opts.opacity == null ? 0.95 : opts.opacity,
      depthWrite: false, fog: false
    });
    const g = new T.Group();
    const sg = new T.CylinderGeometry(1, 1, 1, 10, 1, false);
    sg.translate(0, 0.5, 0);
    const shaft = new T.Mesh(sg, mat);
    const hg = new T.ConeGeometry(1, 1, 14, 1, false);
    hg.translate(0, 0.5, 0);
    const head = new T.Mesh(hg, mat);
    g.add(shaft, head);
    g.mat = mat;
    g.userData.len = 1;
    g.userData.rad = 0.22;

    g.setArrow = function (origin, direction, len, rad) {
      if (len < 0.001) { g.visible = false; return; }
      g.visible = true;
      const r = rad == null ? g.userData.rad : rad;
      const hl = Math.min(len * 0.34, r * 7.5);
      g.position.copy(origin);
      g.quaternion.setFromUnitVectors(UP, direction.clone().normalize());
      shaft.scale.set(r, Math.max(0.0001, len - hl), r);
      head.scale.set(r * 2.5, hl, r * 2.5);
      head.position.y = len - hl;
    };
    g.setOpacity = function (o) { mat.opacity = o; g.visible = o > 0.01; };
    g.renderOrder = 9;
    (APP.curGroup || scene).add(g);
    return g;
  };

  /* ---------------- 圆点贴图 ---------------- */
  APP.dot = (function () {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.28, 'rgba(255,255,255,0.95)');
    rg.addColorStop(0.62, 'rgba(255,255,255,0.32)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); g.fill();
    const t = new T.CanvasTexture(cv);
    t.colorSpace = T.SRGBColorSpace;
    return t;
  })();

  APP.points = function (n, color, size, opacity) {
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(new Float32Array(n * 3), 3));
    const mat = new T.PointsMaterial({
      color, size, map: APP.dot, transparent: true, opacity: opacity == null ? 0.9 : opacity,
      depthWrite: false, blending: T.AdditiveBlending, sizeAttenuation: true, fog: false

    return p;
  };

  APP.group = function (name) {
    const g = new T.Group();
    g.name = name;
    g.visible = false;
    APP.curMode = name;
    APP.curGroup = g;
    scene.add(g);
    APP.scenes[name] = g;
    return g;
  };


  /* ---------------- 世界底图（供 3D 地球贴图与 2D 地图共用） ---------------- */
  APP.worldCanvas = function (W, H, opt) {
    opt = opt || {};
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    const rings = window.LAND_RINGS || [];

    if (!opt.noOcean) {
      const grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, opt.oceanTop || '#0b2b40');
      grd.addColorStop(0.48, opt.oceanMid || '#081d2c');
      grd.addColorStop(1, opt.oceanBot || '#061420');
      g.fillStyle = grd;
      g.fillRect(0, 0, W, H);
    }

    const X = (lon) => (lon + 180) / 360 * W;
    const Y = (lat) => (90 - lat) / 180 * H;

    // 少数岛屿（斐济、弗兰格尔岛等）的轮廓跨过 180° 经线：按 ±360° 复制补齐，
    // 否则会在地图上出现一条横贯全图的假陆地
    const SHIFTS = rings.map((ring) => {
      let lo = 1e9, hi = -1e9;
      for (let i = 0; i < ring.length; i++) { const l = ring[i][0]; if (l < lo) lo = l; if (l > hi) hi = l; }
      const out = [];
      for (const sh of [-360, 0, 360]) if (hi + sh >= -180 && lo + sh <= 180) out.push(sh);
      return out.length ? out : [0];
    });

    function traceRings() {
      g.beginPath();
      for (let k = 0; k < rings.length; k++) {
        const ring = rings[k], sh = SHIFTS[k];
        for (let s = 0; s < sh.length; s++) {
          const off = sh[s];
          for (let i = 0; i < ring.length; i++) {
            const x = X(ring[i][0] + off), y = Y(ring[i][1]);
            if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
          }
          g.closePath();
        }
      }
    }

    traceRings();
    g.fillStyle = opt.land || '#1e4356';
    g.fill('evenodd');

    g.save();
    g.clip('evenodd');
    const lg = g.createLinearGradient(0, 0, W * 0.4, H);
    lg.addColorStop(0, opt.landHi || 'rgba(60,120,142,0.55)');
    lg.addColorStop(0.5, 'rgba(40,86,104,0.18)');
    lg.addColorStop(1, 'rgba(16,44,58,0.42)');
    g.fillStyle = lg;
    g.fillRect(0, 0, W, H);
    g.restore();

    g.strokeStyle = opt.coast || '#79cfe8';
    g.lineWidth = Math.max(1, W / 1500);
    g.globalAlpha = opt.coastAlpha == null ? 0.55 : opt.coastAlpha;
    for (let k = 0; k < rings.length; k++) {
      const ring = rings[k], sh = SHIFTS[k];
      for (let s = 0; s < sh.length; s++) {
        const off = sh[s];
        g.beginPath();
        for (let i = 0; i < ring.length; i++) {
          const x = X(ring[i][0] + off), y = Y(ring[i][1]);
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      }
    }
    g.globalAlpha = 1;

    return { cv, X, Y, W, H };
  };

  /* ---------------- 玻璃水箱（把场景微缩成模型） ---------------- */
  APP.tank = function (w, h, d, cx, cy, cz, tint) {
    const g = new T.Group();
    const geo = new T.BoxGeometry(w, h, d);
    const edges = new T.LineSegments(
      new T.EdgesGeometry(geo),
      new T.LineBasicMaterial({ color: tint || 0x63b9d6, transparent: true, opacity: 0.26, depthWrite: false, fog: false })
    );
    edges.position.set(cx, cy, cz);
    edges.renderOrder = 2;
    g.add(edges);

    const topGeo = new T.BoxGeometry(w, 0.02, d);
    const top = new T.LineSegments(
      new T.EdgesGeometry(topGeo),
      new T.LineBasicMaterial({ color: 0xa9e6ff, transparent: true, opacity: 0.5, depthWrite: false, fog: false })
    );
    top.position.set(cx, cy + h / 2, cz);
    top.renderOrder = 2;
    g.add(top);

    const glass = new T.Mesh(geo, new T.MeshBasicMaterial({
      color: 0x5fb8dc, transparent: true, opacity: 0.03, side: T.BackSide, depthWrite: false, fog: false
    }));
    glass.position.set(cx, cy, cz);
    glass.renderOrder = 1;
    g.add(glass);

    // 四个立柱，强化“立方体”感
    const [hw, hh, hd] = [w / 2, h / 2, d / 2];
    const cornerPts = [];
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sz]) => {
      cornerPts.push(cx + sx * hw, cy - hh, cz + sz * hd, cx + sx * hw, cy + hh, cz + sz * hd);
    });
    const cg = new T.BufferGeometry();
    cg.setAttribute('position', new T.Float32BufferAttribute(cornerPts, 3));
    const corners = new T.LineSegments(cg, new T.LineBasicMaterial({
      color: tint || 0x63b9d6, transparent: true, opacity: 0.22, depthWrite: false, fog: false
    }));
    corners.renderOrder = 2;
    g.add(corners);

    (APP.curGroup || scene).add(g);
    return g;
  };

  /* ---------------- 水体容积（让水箱里“有水的体积感”） ---------------- */
  APP.waterVolume = function (w, h, d, cx, cy, cz, color) {
    const mat = new T.ShaderMaterial({
      transparent: true, depthWrite: false, side: T.BackSide, fog: false,
      uniforms: { uColor: { value: new T.Color(color || 0x0d4a66) } },
      vertexShader: 'varying float vY; void main(){ vY = position.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 uColor; varying float vY; void main(){ float h = clamp((vY+0.5),0.0,1.0); float a = 0.16*pow(h,1.6)+0.02; gl_FragColor = vec4(uColor, a); }'
    });
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    m.position.set(cx, cy, cz);
    m.renderOrder = 2;
    (APP.curGroup || scene).add(m);
    return m;
  };

  /* ---------------- 波浪箭头（海水流动） ---------------- */
  const XAXIS = new T.Vector3(1, 0, 0);
  APP.wave = function (color, opts) {
    opts = opts || {};
    const mat = new T.MeshBasicMaterial({
      color, transparent: true, opacity: opts.opacity == null ? 0.95 : opts.opacity,
      depthWrite: false, fog: false
    });
    const g = new T.Group();
    let body = null, tip = null, key = '';

    function build(len, amp, rad) {
      if (body) { g.remove(body); body.geometry.dispose(); }
      if (tip) { g.remove(tip); tip.geometry.dispose(); }
      const N = Math.max(16, Math.round(len * 2.2));
      const pts = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N;
        pts.push(new T.Vector3(u * len, Math.sin(u * Math.PI * 2.6 - 1.2) * amp, 0));
      }
      const cv = new T.CatmullRomCurve3(pts);
      body = new T.Mesh(new T.TubeGeometry(cv, N, rad, 7, false), mat);
      g.add(body);
      const hl = Math.min(len * 0.30, rad * 8.5);
      tip = new T.Mesh(new T.ConeGeometry(rad * 2.7, hl, 14, 1, false), mat);
      tip.quaternion.setFromUnitVectors(UP, XAXIS);
      tip.position.set(len + hl * 0.42, 0, 0);
      g.add(tip);
      key = len.toFixed(2) + '|' + amp.toFixed(3) + '|' + rad.toFixed(3);
    }

    g.setArrow = function (origin, dir, len, amp, rad) {
      if (len < 0.001) { g.visible = false; return; }
      g.visible = true;
      amp = amp == null ? 0.16 : amp;
      rad = rad == null ? 0.22 : rad;
      const k = len.toFixed(2) + '|' + amp.toFixed(3) + '|' + rad.toFixed(3);
      if (k !== key) build(len, amp, rad);
      g.position.copy(origin);
      g.quaternion.setFromUnitVectors(XAXIS, dir.clone().normalize());
    };
    g.setOpacity = function (o) { mat.opacity = o; g.visible = o > 0.01; };
    g.renderOrder = 9;
    (APP.curGroup || scene).add(g);
    return g;
  };

  /* ---------------- 风纹（风的形状） ---------------- */
  APP.windMark = function (color, opts) {
    opts = opts || {};
    const mat = new T.LineBasicMaterial({
      color, transparent: true, opacity: opts.opacity == null ? 0.75 : opts.opacity,
      depthWrite: false, fog: false
    });
    const g = new T.Group();
    let lines = null, key = '';

    function build(len, amp) {
      if (lines) { g.remove(lines); lines.geometry.dispose(); }
      const N = 34;
      const pos = [];
      const rows = [{ o: -0.30, s: 0.80, p: 0.0 }, { o: 0.0, s: 1.0, p: 0.6 }, { o: 0.30, s: 0.72, p: 1.3 }];
      rows.forEach((r) => {
        let prev = null;
        for (let i = 0; i <= N; i++) {
          const u = i / N;
          const x = u * len * r.s;
          const y = r.o * amp * 2.2 + Math.sin(u * Math.PI * 2.2 + r.p) * amp;
          if (prev) pos.push(prev[0], prev[1], 0, x, y, 0);
          prev = [x, y];
        }
      });
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      lines = new T.LineSegments(geo, mat);
      g.add(lines);
      key = len.toFixed(2) + '|' + amp.toFixed(3);
    }

    g.setWind = function (origin, dir, len, amp) {
      if (len < 0.001) { g.visible = false; return; }
      g.visible = true;
      amp = amp == null ? 0.5 : amp;
      const k = len.toFixed(2) + '|' + amp.toFixed(3);
      if (k !== key) build(len, amp);
      g.position.copy(origin);
      g.quaternion.setFromUnitVectors(XAXIS, dir.clone().normalize());
    };
    g.setOpacity = function (o) { mat.opacity = o; g.visible = o > 0.01; };
    g.renderOrder = 9;
    (APP.curGroup || scene).add(g);
    return g;
  };

  /* ---------------- resize ---------------- */
  APP.onResize = function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (A.mapEnter) A.mapEnter();
    if (A.monsoonEnter) A.monsoonEnter();
  };
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  APP.updateCamera();
})();

</script>
<script>
/* ============ 第一幕：风海流 ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;
  const G = A.group('wind');

  /* ---------- 水箱 ---------- */
  A.tank(58, 64, 58, 0, -25, 0, 0x63b9d6);
  A.waterVolume(56, 56, 56, 0, -28, 0, 0x1a6c8e);

  /* ---------- 海面 ---------- */
  const oceanGeo = new T.PlaneGeometry(56, 56, 80, 80);
  oceanGeo.rotateX(-Math.PI / 2);

  const oceanMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: { uTime: { value: 0 }, uWind: { value: 8 } },
    vertexShader: `
      uniform float uTime; uniform float uWind;
      varying vec3 vW; varying vec3 vN; varying float vH;
      void main(){
        vec3 p = position;
        float t = uTime;
        vec2 g = vec2(0.0);
        float h = 0.0;
        vec2 d1 = normalize(vec2(1.0, 0.28));
        float k1 = 0.115, a1 = 0.55;
        float ph1 = dot(d1, p.xz)*k1 + t*1.05;
        h += a1*sin(ph1); g += a1*k1*d1*cos(ph1);
        vec2 d2 = normalize(vec2(-0.55, 1.0));
        float k2 = 0.19, a2 = 0.34;
        float ph2 = dot(d2, p.xz)*k2 + t*1.6;
        h += a2*sin(ph2); g += a2*k2*d2*cos(ph2);
        vec2 d3 = normalize(vec2(0.75, -0.66));
        float k3 = 0.40, a3 = 0.16;
        float ph3 = dot(d3, p.xz)*k3 + t*2.5;
        h += a3*sin(ph3); g += a3*k3*d3*cos(ph3);

        float amp = 0.55 + uWind*0.06;
        p.y += h*amp;
        vH = h;
        vW = (modelMatrix * vec4(p,1.0)).xyz;
        vN = normalize(vec3(-g.x*amp, 1.0, -g.y*amp));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0);
      }`,
    fragmentShader: `
      varying vec3 vW; varying vec3 vN; varying float vH;
      void main(){
        vec3 V = normalize(cameraPosition - vW);
        vec3 N = normalize(vN);
        float fres = pow(1.0 - max(dot(N, V), 0.0), 3.5);
        vec3 deep = vec3(0.028, 0.105, 0.150);
        vec3 mid  = vec3(0.060, 0.290, 0.390);
        vec3 sky  = vec3(0.140, 0.430, 0.560);
        vec3 col = mix(deep, mid, 0.45 + 0.55*smoothstep(-0.6, 0.9, vH));
        col = mix(col, sky, fres*0.75);
        vec3 L = normalize(vec3(0.35, 0.72, 0.42));
        vec3 Hv = normalize(L + V);
        float spec = pow(max(dot(N, Hv), 0.0), 120.0);
        col += vec3(0.9, 0.97, 1.0) * spec * 1.4;

        vec2 gp = vW.xz / 16.0;
        vec2 q = abs(fract(gp - 0.5) - 0.5);
        float d = min(q.x, q.y);
        float w = 0.008 + length(vW.xz) * 0.00035;
        float grid = 1.0 - smoothstep(0.0, w, d);
        col = mix(col, vec3(0.55, 0.92, 1.0), grid * 0.18);

        float dist = length(vW.xz);
        float alpha = (1.0 - smoothstep(72.0, 128.0, dist)) * 0.94;
        gl_FragColor = vec4(col, alpha);
      }`
  });
  const ocean = new T.Mesh(oceanGeo, oceanMat);
  ocean.renderOrder = 3;
  G.add(ocean);

  /* ---------- 深处网格 ---------- */
  [-30, -56].forEach((y, i) => {
    const gh = new T.GridHelper(52, 8, 0x2a8ea8, 0x0e3a4a);
    gh.position.y = y;
    gh.material.transparent = true;
    gh.material.opacity = 0.18 - i * 0.06;
    gh.material.depthWrite = false;
    gh.renderOrder = 1;
    G.add(gh);
  });

  /* ---------- 示踪粒子 ---------- */
  const LAYERS = [0, -13, -26, -39, -52];
  const PER = 34;
  const N = LAYERS.length * PER;
  const HALF = 26;

  const px = new Float32Array(N), pz = new Float32Array(N);
  const vx = new Float32Array(N), vz = new Float32Array(N);
  const layerOf = new Uint8Array(N);

  const colors = new Float32Array(N * 3);
  const cTop = new T.Color(0xc8fbff), cBot = new T.Color(0x3a86d8);

  for (let i = 0; i < N; i++) {
    const li = Math.floor(i / PER);
    layerOf[i] = li;
    px[i] = (Math.random() * 2 - 1) * HALF;
    pz[i] = (Math.random() * 2 - 1) * HALF;
    const c = cTop.clone().lerp(cBot, li / (LAYERS.length - 1));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }

  const pGeo = new T.BufferGeometry();
  pGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(N * 3), 3));
  pGeo.setAttribute('color', new T.BufferAttribute(colors, 3));
  const pMat = new T.PointsMaterial({
    size: 2.0, map: A.dot, vertexColors: true, transparent: true, opacity: 0.95,
    depthWrite: false, blending: T.AdditiveBlending, sizeAttenuation: true, fog: false
  });
  const pts = new T.Points(pGeo, pMat);
  pts.frustumCulled = false;
  pts.renderOrder = 6;
  G.add(pts);

  const sGeo = new T.BufferGeometry();
  sGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(N * 6), 3));
  const sMat = new T.LineBasicMaterial({
    color: 0x7fe3ff, transparent: true, opacity: 0.35,
    depthWrite: false, blending: T.AdditiveBlending, fog: false
  });
  const streaks = new T.LineSegments(sGeo, sMat);
  streaks.frustumCulled = false;
  streaks.renderOrder = 5;
  G.add(streaks);

  /* ---------- 埃克曼螺旋 ---------- */
  const COL = { x: -11, z: -2 };
  const ekArrows = LAYERS.map(() => A.arrow(0x9df0ff, { opacity: 0.92 }));
  const envGeo = new T.BufferGeometry();
  envGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(LAYERS.length * 3), 3));
  const envLine = new T.Line(envGeo, new T.LineBasicMaterial({
    color: 0xffc06a, transparent: true, opacity: 0.75, depthWrite: false, fog: false
  }));
  envLine.frustumCulled = false;
  envLine.renderOrder = 7;
  G.add(envLine);

  const colGeo = new T.BufferGeometry();
  colGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([
    COL.x, 1, COL.z, COL.x, -54, COL.z
  ]), 3));
  const colLine = new T.Line(colGeo, new T.LineBasicMaterial({
    color: 0x4fa0b8, transparent: true, opacity: 0.45, depthWrite: false, fog: false
  }));
  colLine.renderOrder = 4;
  G.add(colLine);

  /* ---------- 风、表层流、净输送 ---------- */
  const windArrows = [];
  for (let i = 0; i < 7; i++) windArrows.push(A.arrow(0xe8f7ff, { opacity: 0.55 }));

  const aFlow = A.arrow(0x6ef0b0, { opacity: 1 });
  const aNet = A.arrow(0xffb15c, { opacity: 1 });

  const ARC_N = 40;
  const arcGeo = new T.BufferGeometry();
  arcGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(ARC_N * 3), 3));
  const arcLine = new T.Line(arcGeo, new T.LineBasicMaterial({
    color: 0xffb15c, transparent: true, opacity: 0.55, depthWrite: false, fog: false
  }));
  arcLine.frustumCulled = false;
  arcLine.renderOrder = 9;
  G.add(arcLine);

  const lWind = A.label('风（信风）', 'accent'); lWind.off = [-10, -20];
  lWind.pos.set(-24, 4, -16);
  const lFlow = A.label('表层流速 · 偏 45°', 'green'); lFlow.off = [70, 10];
  const lCor = A.label('地转偏向力 · 向右偏', 'cyan'); lCor.off = [-64, -16];
  const lNet = A.label('净输送 · 偏 90°', 'amber'); lNet.off = [0, -26];
  const lCol = A.label('上层带动下层', 'amber'); lCol.off = [-96, 6];
  const lDeep = A.label('越深越慢 · 地转偏向力持续偏转', 'dim'); lDeep.off = [40, 26];

  /* ---------- 物理 ---------- */
  const DEG = Math.PI / 180;
  function angleAt(li) {
    return S.hemi * S.rot * (45 + 32 * li) * DEG;
  }
  function speedAt(li) {
    return S.wind * 0.30 * Math.exp(-li * 0.38);
  }

  const _o = new T.Vector3(), _d = new T.Vector3();

  function update(dt) {
    oceanMat.uniforms.uTime.value = S.t;
    oceanMat.uniforms.uWind.value = S.wind;

    const P = pGeo.attributes.position.array;
    const SP = sGeo.attributes.position.array;
    const E = envGeo.attributes.position.array;

    for (let i = 0; i < N; i++) {
      const li = layerOf[i];
      const sp = speedAt(li);
      const an = angleAt(li);
      vx[i] = Math.cos(an) * sp;
      vz[i] = Math.sin(an) * sp;

      px[i] += vx[i] * dt;
      pz[i] += vz[i] * dt;
      if (px[i] > HALF) px[i] -= HALF * 2;
      if (px[i] < -HALF) px[i] += HALF * 2;
      if (pz[i] > HALF) pz[i] -= HALF * 2;
      if (pz[i] < -HALF) pz[i] += HALF * 2;

      const y = LAYERS[li];
      P[i * 3] = px[i]; P[i * 3 + 1] = y; P[i * 3 + 2] = pz[i];

      const k = 0.34;
      SP[i * 6] = px[i] - vx[i] * k; SP[i * 6 + 1] = y; SP[i * 6 + 2] = pz[i] - vz[i] * k;
      SP[i * 6 + 3] = px[i]; SP[i * 6 + 4] = y; SP[i * 6 + 5] = pz[i];
    }
    pGeo.attributes.position.needsUpdate = true;
    sGeo.attributes.position.needsUpdate = true;

    /* 螺旋 */
    for (let i = 0; i < LAYERS.length; i++) {
      const y = LAYERS[i], sp = speedAt(i), an = angleAt(i);
      _o.set(COL.x, y, COL.z);
      _d.set(Math.cos(an), 0, Math.sin(an));
      const len = 5.0 + sp * 2.6;
      ekArrows[i].setArrow(_o, _d, len, 0.4);
      E[i * 3] = COL.x + Math.cos(an) * len;
      E[i * 3 + 1] = y;
      E[i * 3 + 2] = COL.z + Math.sin(an) * len;
    }
    envGeo.attributes.position.needsUpdate = true;
    lCol.pos.set(COL.x, -6, COL.z);
    lDeep.pos.set(COL.x, -48, COL.z);

    /* 风箭头 */
    const wl = 9 + S.wind * 0.35;
    for (let i = 0; i < windArrows.length; i++) {
      const a = windArrows[i];
      const x = -26 + ((i * 9 + S.t * 8) % 52);
      _o.set(x, 4 + Math.sin(S.t * 1.2 + i) * 0.4, -20 + (i % 3) * 9);
      _d.set(1, 0, 0);
      a.setArrow(_o, _d, wl, 0.30);
    }
    
    /* 表层流 */
    const sp0 = speedAt(0), an0 = angleAt(0);
    _o.set(COL.x, 0.4, COL.z);
    const lv = 6 + sp0 * 5.4;
    aFlow.setArrow(_o, new T.Vector3(Math.cos(an0), 0, Math.sin(an0)), lv, 0.36);
    lFlow.pos.set(COL.x + Math.cos(an0) * (lv + 2), 0.4, COL.z + Math.sin(an0) * (lv + 2));
    const degTxt = Math.round(45 * S.rot);
    if (lFlow.el.textContent !== '表层流速 · 偏 ' + degTxt + '°') lFlow.el.textContent = '表层流速 · 偏 ' + degTxt + '°';
    lNet.el.textContent = '净输送 · 偏 ' + Math.round(90 * S.rot) + '°';
    lCor.el.textContent = '地转偏向力 · ' + (S.hemi > 0 ? '向右偏' : '向左偏');
    lCor.pos.set(COL.x, 2.5, COL.z);

    /* 净输送：从风向扫到净输送方向（北半球右偏 90°，南半球左偏 90°） */
    const ang = Math.PI / 2 * S.rot * S.hemi;
    const AP = arcGeo.attributes.position.array;
    const R0 = 11, cy = -1.4;
    for (let i = 0; i < ARC_N; i++) {
      const a = ang * i / (ARC_N - 1);          // a=0 指向风向（+x），正角朝 +z 偏
      AP[i * 3] = COL.x + Math.cos(a) * R0;
      AP[i * 3 + 1] = cy;
      AP[i * 3 + 2] = COL.z + Math.sin(a) * R0;
    }
    arcGeo.attributes.position.needsUpdate = true;
    arcLine.visible = Math.abs(ang) > 0.05;

    const ex = COL.x + Math.cos(ang) * R0, ez = COL.z + Math.sin(ang) * R0;
    aNet.visible = Math.abs(ang) > 0.05;
    if (aNet.visible) {
      aNet.setArrow(new T.Vector3(ex, cy, ez),
        new T.Vector3(Math.cos(ang), 0, Math.sin(ang)), 7 + S.wind * 0.22, 0.42);
      lNet.pos.set(ex + Math.cos(ang) * 3, cy + 1, ez + Math.sin(ang) * 3);
    }
    lNet.on = aNet.visible;
  }

  A.wind = { G, update, speedAt, angleAt };
})();

<script>
/* ============ 第二幕：密度流（直布罗陀海峡） ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;
  const G = A.group('dens');

  /* ---------- 水箱 ---------- */
  A.tank(140, 70, 34, 0, -23, 0, 0x8f7fd8);

  const ZD = 26;          // 剖面厚度
  let seabed = null;

  const seabedMat = new T.MeshStandardMaterial({
    color: 0x27333f, roughness: 0.9, metalness: 0.15, flatShading: true
  });

  function buildSeabed() {
    if (seabed) {
      G.remove(seabed);
      seabed.geometry.dispose();
    }
    const s = new T.Shape();
    const st = S.sill;
    s.moveTo(-62, -52);
    s.lineTo(-62, -34);
    s.lineTo(-20, -34);
    s.lineTo(-12, -29);
    s.lineTo(-5, st);
    s.lineTo(5, st);
    s.lineTo(12, -29);
    s.lineTo(20, -34);
    s.lineTo(62, -34);
    s.lineTo(62, -52);
    s.lineTo(-62, -52);
    const geo = new T.ExtrudeGeometry(s, { depth: ZD, bevelEnabled: false });
    geo.translate(0, 0, -ZD / 2);
    seabed = new T.Mesh(geo, seabedMat);
    G.add(seabed);
  }
  buildSeabed();

  /* ---------- 水体 ---------- */
  const waterMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: {
      uSill: { value: S.sill },
      uTint: { value: 0 },
      uLight: { value: new T.Color(0x2c6f9c) },
      uDense: { value: new T.Color(0xa8764c) }
    },
    vertexShader: 'varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `
      uniform float uSill; uniform float uTint;
      uniform vec3 uLight; uniform vec3 uDense;
      varying vec3 vW;
      void main(){
        float x = vW.x, d = -vW.y;
        /* 地中海一侧：整层都是高盐高密水，只有极薄的一层大西洋轻水浮在表层；
           大西洋一侧：密度水贴着海底铺开、向西变深变厚，上面是被带走的轻水。 */
        float side = smoothstep(-4.0, 5.0, x);            // 0=大西洋 1=地中海
        float base = mix(31.0, 4.5, side);                // 界面深度：西深东浅
        float idepth = mix(base, -uSill, exp(-x*x/95.0));  // 海峡处贴着海槛翻越
        float dense = smoothstep(idepth-1.3, idepth+1.3, d);
        vec3 col = mix(uLight, uDense, dense);
        float band = exp(-pow((d-idepth)/1.3, 2.0));
        col += vec3(0.85,0.95,1.0) * band * 0.16;
        col *= mix(1.0, 0.62, clamp(d/40.0, 0.0, 1.0));   // 深处压暗，避免发亮
        col *= 0.88 + 0.28*smoothstep(0.0, -6.0, vW.y);
        float aBase = 0.38 + 0.32*smoothstep(14.0, 0.0, d);
        // 高盐高密的一侧更实，一眼能分出两层水
        float a = mix(aBase, min(0.78, aBase + 0.18), dense);
        a *= 0.84 + 0.16*smoothstep(-52.0, -20.0, abs(x));
        gl_FragColor = vec4(col, a);
      }`
  });
  const water = new T.Mesh(new T.PlaneGeometry(124, 36), waterMat);
  water.position.set(0, -18, 0);
  water.renderOrder = 2;
  G.add(water);

  /* ---------- 水面线 ---------- */
  const surfGeo = new T.BufferGeometry();
  surfGeo.setAttribute('position', new T.BufferAttribute(new Float32Array([-62, 0.1, 0, 62, 0.1, 0]), 3));
  const surf = new T.Line(surfGeo, new T.LineBasicMaterial({
    color: 0x9fe8ff, transparent: true, opacity: 0.55, depthWrite: false, fog: false
  }));
  G.add(surf);

  /* ---------- 流动曲线 ---------- */
  let curveOut = null, curveIn = null;
  function curvePoints() {
    const st = S.sill;
    return {
      out: [
        [42, -31], [26, -30], [16, -28.4], [8, st + 2.6], [0, st + 2.2], [-8, st + 2.6],
        [-16, -28.4], [-24, -30.5], [-38, -32], [-52, -32.5]
      ],
      in: [
        [-56, -3.4], [-38, -3.0], [-20, -3.2], [-8, -3.4], [0, -3.6], [10, -3.6], [24, -4.0], [40, -4.6], [56, -5.2]
      ]
    };
  }
  function rebuildCurves() {
    const p = curvePoints();
    curveOut = new T.CatmullRomCurve3(p.out.map((q) => new T.Vector3(q[0], q[1], 0)), false, 'catmullrom', 0.4);
    curveIn = new T.CatmullRomCurve3(p.in.map((q) => new T.Vector3(q[0], q[1], 0)), false, 'catmullrom', 0.4);
  }
  rebuildCurves();

  /* ---------- 粒子 ---------- */
  const COUNT = 90;
  const outPts = A.points(COUNT, 0xffb066, 1.5, 0.95);
  const inPts = A.points(COUNT, 0x6fd0ff, 1.4, 0.9);
  outPts.renderOrder = 8; inPts.renderOrder = 8;
  G.add(outPts, inPts);

  const phases = new Float32Array(COUNT);
  const jitter = [];
  for (let i = 0; i < COUNT; i++) {
    phases[i] = i / COUNT;
    jitter.push({ z: (Math.random() * 2 - 1) * 7, o: (Math.random() * 2 - 1) * 1.2, s: Math.random() * 6.283 });
  }

  /* ---------- 箭头 ---------- */
  const aOut = A.arrow(0xffa657, { opacity: 0.95 });
  const aIn = A.arrow(0x63c8ff, { opacity: 0.95 });
  const outFlow = [A.arrow(0xffb066, { opacity: 0.7 }), A.arrow(0xffb066, { opacity: 0.7 })];
  const inFlow = [A.arrow(0x6fd0ff, { opacity: 0.7 }), A.arrow(0x6fd0ff, { opacity: 0.7 })];

  /* ---------- 标签 ---------- */
  const lAtl = A.label('大 西 洋'), lMed = A.label('地 中 海');
  const lSill = A.label('海槛', 'dim');
  const lOut = A.label('高盐高密水 · 底层流出', 'amber');
  const lIn = A.label('低盐海水 · 表层流入', 'cyan');
  const lInt = A.label('密度界面', 'dim');
  const lSalt = A.label('盐度高 → 密度大', 'amber');
  const lSink = A.label('密度大 → 下沉', 'amber');

  /* ---------- 物理 ---------- */
  function strength() {
    const sillF = A.clamp((-S.sill - 8) / 14, 0, 1);
    const salF = 0.18 + (S.sal / 4) * 1.0;
    return sillF * salF;
  }

  const _p = new T.Vector3(), _p2 = new T.Vector3(), _t = new T.Vector3();

  function update(dt) {
    const str = strength();
    const speed = 0.055 * str;

    const op = outPts.geometry.attributes.position.array;
    const ip = inPts.geometry.attributes.position.array;

    for (let i = 0; i < COUNT; i++) {
      phases[i] = (phases[i] + dt * speed * (i % 3 === 0 ? 1.12 : 1)) % 1;
      const j = jitter[i];
      if (curveOut) {
        curveOut.getPointAt(phases[i], _p);
        _p.z = j.z;
        _p.y += Math.sin(S.t * 1.6 + j.s) * 0.25;
        op[i * 3] = _p.x; op[i * 3 + 1] = _p.y; op[i * 3 + 2] = _p.z;
      }
      if (curveIn) {
        curveIn.getPointAt((phases[i] + 0.35) % 1, _p2);
        _p2.z = j.z * 0.9;
        _p2.y += Math.cos(S.t * 1.4 + j.s) * 0.22;
        ip[i * 3] = _p2.x; ip[i * 3 + 1] = _p2.y; ip[i * 3 + 2] = _p2.z;
      }
    }
    outPts.geometry.attributes.position.needsUpdate = true;
    inPts.geometry.attributes.position.needsUpdate = true;

    const vis = str > 0.06;
    outPts.material.opacity = 0.25 + str * 0.7;
    inPts.material.opacity = 0.25 + str * 0.65;

    /* 主箭头 */
    if (curveOut) {
      curveOut.getPointAt(0.30, _p); curveOut.getTangentAt(0.30, _t);
      aOut.setArrow(_p, _t, 9 + str * 10, 0.55);
      lOut.pos.copy(_p).add(new T.Vector3(0, -4, 0));
      outFlow[0].setArrow(curveOut.getPointAt(0.62, _p).clone(), curveOut.getTangentAt(0.62, _t), 5, 0.3);
      outFlow[1].setArrow(curveOut.getPointAt(0.84, _p).clone(), curveOut.getTangentAt(0.84, _t), 5, 0.3);
    }
    if (curveIn) {
      curveIn.getPointAt(0.34, _p); curveIn.getTangentAt(0.34, _t);
      aIn.setArrow(_p, _t, 9 + str * 10, 0.55);
      lIn.pos.copy(_p).add(new T.Vector3(0, 4.2, 0));
      inFlow[0].setArrow(curveIn.getPointAt(0.64, _p).clone(), curveIn.getTangentAt(0.64, _t), 5, 0.3);
      inFlow[1].setArrow(curveIn.getPointAt(0.85, _p).clone(), curveIn.getTangentAt(0.85, _t), 5, 0.3);
    }

    const dim = vis ? 0.95 : 0.2;
    aOut.setOpacity(dim); aIn.setOpacity(dim);
    lOut.on = vis; lIn.on = vis;
    lOut.el.style.opacity = vis ? '1' : '0.25';
    lIn.el.style.opacity = vis ? '1' : '0.25';

    /* 静态标签 */
    // 竖屏时视野变窄，两个海盆的名字往中间收一点，免得被裁掉
    const portrait = window.innerWidth / window.innerHeight < 0.85;
    lAtl.pos.set(portrait ? -26 : -40, 6, 0);
    lMed.pos.set(portrait ? 25 : 38, 6, 0);
    lSill.pos.set(0, S.sill - 3.4, 0);
    lInt.pos.set(-26, -30.5, 0);
    lSalt.pos.set(portrait ? 21 : 30, -12, 0);
    lSink.pos.set(17, -20, 0);

    waterMat.uniforms.uSill.value = S.sill;
    waterMat.uniforms.uDense.value.setHex(S.sal > 2.6 ? 0xb5794a : 0xa8764c);
  }

  function rebuild() {
    buildSeabed();
    rebuildCurves();
  }

  A.dens = { G, update, rebuild, strength };
})();

/* ============ 第三幕：补偿流（秘鲁沿岸上升流） ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;
  const G = A.group('comp');

  /* ---------- 地形 ---------- */
  const landShape = new T.Shape();
  landShape.moveTo(-58, 9);
  landShape.lineTo(-26, 9);
  landShape.lineTo(-26, 1.8);
  landShape.lineTo(-22.5, -3.5);
  landShape.lineTo(-19.5, -15);
  landShape.lineTo(-14, -24);
  landShape.lineTo(-4, -27);
  landShape.lineTo(14, -29);
  landShape.lineTo(70, -30);
  landShape.lineTo(70, -36);
  landShape.lineTo(-58, -36);

  const landGeo = new T.ExtrudeGeometry(landShape, { depth: 26, bevelEnabled: false });
  landGeo.translate(0, 0, -13);
  const land = new T.Mesh(landGeo, new T.MeshStandardMaterial({
    color: 0x5a6878, roughness: 0.92, metalness: 0.1, flatShading: true
  }));
  G.add(land);

  /* ---------- 水体 ---------- */
  const waterGeo = new T.PlaneGeometry(140, 30, 70, 12);
  waterGeo.translate(0, -15, 0);

  const waterMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: { uDip: { value: 0 }, uCold: { value: 0 }, uTime: { value: 0 } },
    vertexShader: `
      uniform float uDip;
      varying vec3 vW;
      void main(){
        vec3 p = position;
        float edge = smoothstep(-31.0, -5.0, p.y);
        p.y -= uDip * exp(-pow((p.x + 21.0)/14.0, 2.0)) * edge;
        vW = (modelMatrix*vec4(p,1.0)).xyz;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader: `
      uniform float uCold; uniform float uTime;
      varying vec3 vW;
      void main(){
        float d = -vW.y;
        vec3 surf = vec3(0.10, 0.40, 0.53);
        vec3 deep = vec3(0.012, 0.050, 0.088);
        vec3 col = mix(surf, deep, smoothstep(1.0, 24.0, d));
        float plume = exp(-pow((vW.x + 13.0)/13.0, 2.0)) * smoothstep(1.0, 24.0, d) * uCold;
        col = mix(col, vec3(0.20, 0.52, 0.82), plume * 0.6);
        float a = 0.52 - 0.14*smoothstep(0.0, 28.0, d);
        gl_FragColor = vec4(col, a);
      }`
  });
  const water = new T.Mesh(waterGeo, waterMat);
  water.renderOrder = 2;
  G.add(water);

  /* ---------- 水面高光线 ---------- */
  const surfN = 60;
  const surfGeo = new T.BufferGeometry();
  surfGeo.setAttribute('position', new T.BufferAttribute(new Float32Array(surfN * 3), 3));
  const surfLine = new T.Line(surfGeo, new T.LineBasicMaterial({
    color: 0x9fe8ff, transparent: true, opacity: 0.6, depthWrite: false, fog: false
  }));
  G.add(surfLine);

  /* ---------- 上升流曲线 ---------- */
  const upCurve = new T.CatmullRomCurve3([
    new T.Vector3(-17, -25, 0), new T.Vector3(-16.4, -19, 0), new T.Vector3(-15.4, -13, 0),
    new T.Vector3(-13.6, -8, 0), new T.Vector3(-11, -4, 0), new T.Vector3(-7, -1.4, 0),
    new T.Vector3(0, -1.5, 0), new T.Vector3(14, -2.2, 0)
  ], false, 'catmullrom', 0.4);

  const COUNT = 150;
  const upPts = A.points(COUNT, 0x8fe3ff, 1.7, 0.95);
  const nutPts = A.points(90, 0x8ef2a0, 1.3, 0.9);
  const fishPts = A.points(120, 0xe8fbff, 1.5, 0.0);
  upPts.renderOrder = 8; nutPts.renderOrder = 8; fishPts.renderOrder = 8;
  G.add(upPts, nutPts, fishPts);

  const upPhase = new Float32Array(COUNT), nutPhase = new Float32Array(90);
  const upOff = [], nutOff = [];
  for (let i = 0; i < COUNT; i++) {
    upPhase[i] = Math.random();
    upOff.push({ z: (Math.random() * 2 - 1) * 8, a: Math.random() * 2 - 1, s: Math.random() * 6.283 });
  }
  for (let i = 0; i < 90; i++) {
    nutPhase[i] = Math.random();
    nutOff.push({ z: (Math.random() * 2 - 1) * 7, a: Math.random() * 2 - 1, s: Math.random() * 6.283 });
  }

  const fishPos = new Float32Array(120 * 3);
  const fishBase = [];
  for (let i = 0; i < 120; i++) {
    const x = -4 + Math.random() * 34;
    const y = -6 + Math.random() * 4;
    const z = (Math.random() * 2 - 1) * 9;
    fishBase.push({ x, y, z, p: Math.random() * 6.283, r: 0.6 + Math.random() * 1.6 });
    fishPos[i * 3] = x; fishPos[i * 3 + 1] = y; fishPos[i * 3 + 2] = z;
  }
  fishPts.geometry.attributes.position.array.set(fishPos);

  /* ---------- 风 ---------- */
  const windArrows = [];
  for (let i = 0; i < 7; i++) windArrows.push(A.arrow(0xdff2ff, { opacity: 0.7 }));
  const aUp = A.arrow(0x8fd8ff, { opacity: 0.9 });
  const aSurf = A.arrow(0x7df5b5, { opacity: 0.85 });

  /* ---------- 标签 ---------- */
  const lLand = A.label('秘鲁沿岸');
  const lWind = A.label('离岸风（东南信风）');
  const lSurf = A.label('表层水离岸', 'cyan');
  const lUp = A.label('深层冷水上涌', 'cyan');
  const lNut = A.label('营养盐上泛', 'green');
  const lFish = A.label('秘鲁渔场', 'amber');
  const lEln = A.label('厄尔尼诺：信风减弱', 'red');
  lEln.on = false;

  const _p = new T.Vector3();

  function windNow() {
    return S.offshore * (S.elnino ? 0.22 : 1);
  }

  function update(dt) {
    if (S.compKind === 'h') { updateH(dt); return; }
    const w = windNow();
    const strength = A.clamp(w / 12, 0, 1.35);

    waterMat.uniforms.uDip.value = 2.2 * strength;
    waterMat.uniforms.uCold.value = A.clamp(strength * 1.2, 0, 1);
    waterMat.uniforms.uTime.value = S.t;

      const x = -66 + (132 * i) / (surfN - 1);
      SP[i * 3] = x;
      SP[i * 3 + 1] = -2.0 * strength * Math.exp(-Math.pow((x + 21) / 14, 2)) + 0.15;
      SP[i * 3 + 2] = 0;

    surfGeo.attributes.position.needsUpdate = true;

    const NT = nutPts.geometry.attributes.position.array;
    const spd = 0.05 + strength * 0.10;

    for (let i = 0; i < COUNT; i++) {

      UP[i * 3] = _p.x + o.a * 1.8 + Math.sin(S.t * 1.2 + o.s) * 0.3;
      UP[i * 3 + 1] = _p.y;
      UP[i * 3 + 2] = _p.z = o.z;
    }
    upPts.geometry.attributes.position.needsUpdate = true;

    for (let i = 0; i < 90; i++) {
      nutPhase[i] = (nutPhase[i] + dt * spd * 0.9) % 1;
      upCurve.getPointAt(nutPhase[i], _p);
      const o = nutOff[i];
      NT[i * 3] = _p.x + o.a * 2.4 + Math.sin(S.t * 1.7 + o.s) * 0.4;
      NT[i * 3 + 1] = _p.y;
      NT[i * 3 + 2] = o.z;
    }

    nutPts.material.opacity = 0.15 + strength * 0.75;
    upPts.material.opacity = 0.2 + strength * 0.7;

    const FP = fishPts.geometry.attributes.position.array;

      FP[i * 3] = b.x + Math.sin(S.t * 0.5 + b.p) * b.r;
      FP[i * 3 + 1] = b.y + Math.cos(S.t * 0.7 + b.p * 1.3) * b.r * 0.4;
      FP[i * 3 + 2] = b.z + Math.cos(S.t * 0.4 + b.p) * b.r * 0.6;

      windArrows[i].setArrow(new T.Vector3(x, 7 + Math.sin(S.t * 1.3 + i) * 0.4, -14 + (i % 3) * 12),

    }

    /* 主箭头 */
    upCurve.getPointAt(0.30, _p);
    aUp.setArrow(_p.clone(), new T.Vector3(0.16, 1, 0).normalize(), 10 + strength * 12, 0.45);

    lSurf.pos.set(2, 3.4, 0);

    aUp.setOpacity(0.2 + strength * 0.75);
    aSurf.setOpacity(0.2 + strength * 0.7);

    /* 静态标签 */
    lLand.pos.set(-38, 6.5, 0);
    lWind.pos.set(6, 9.5, 0);
    lNut.pos.set(-17, -18, 0);
    lFish.pos.set(6, -6, 0);
    lEln.pos.set(18, 15, 0);
    lEln.on = S.elnino;
    lUp.el.style.opacity = strength > 0.15 ? '1' : '0.3';
  }


  /* ================= 拆分：垂直补偿 GV / 水平补偿 GH ================= */
  const GV = new T.Group();
  while (G.children.length) GV.add(G.children[0]);
  G.add(GV);

  // 垂直场景：给标签打上 kind，并加入水箱
  [lLand, lWind, lSurf, lUp, lNut, lFish, lEln].forEach((l) => { l.kind = 'v'; });
  A.curGroup = GV;
  A.tank(146, 54, 34, 2, -9.5, 0, 0x4fc9a8);
  A.curGroup = G;

  /* ---------------- 水平补偿：赤道逆流 ---------------- */
  const GH = new T.Group();
  GH.visible = false;
  G.add(GH);
  A.curGroup = GH;

  A.tank(100, 30, 48, 0, 3, 0, 0x4fc9a8);

  // 海面（西高东低）
  const seaGeo = new T.PlaneGeometry(96, 46, 1, 1);
  seaGeo.rotateX(-Math.PI / 2);
  const seaMat = new T.ShaderMaterial({
    transparent: true, depthWrite: false, side: T.DoubleSide, fog: false,
    uniforms: { uT: { value: 0 } },
    vertexShader: 'uniform float uT; varying vec3 vW; varying vec2 vP;\n' +
      'void main(){ vP = position.xz; vec3 p = position; p.y += sin(p.x*0.35 + uT*1.6)*0.16 + sin(p.z*0.5 - uT*1.1)*0.12;\n' +
      'vW = (modelMatrix*vec4(p,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }',
    fragmentShader: 'varying vec3 vW; varying vec2 vP;\n' +
      'void main(){ float band = exp(-pow(vP.y/13.0,2.0));\n' +
      'vec3 c = mix(vec3(0.05,0.20,0.30), vec3(0.10,0.42,0.52), band);\n' +
      'float grid = 1.0 - smoothstep(0.0,0.06,min(abs(fract(vP.x/16.0-0.5)-0.5),abs(fract(vP.y/16.0-0.5)-0.5)));\n' +
      'c += vec3(0.20,0.55,0.65)*grid*0.18;\n' +
      'gl_FragColor = vec4(c, 0.9); }'
  });
  const sea = new T.Mesh(seaGeo, seaMat);
  sea.rotation.z = -0.030;            // 西侧（-x）抬高
  sea.renderOrder = 3;
  GH.add(sea);

  // 西侧堆积的水体
  const humpGeo = new T.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
  const hump = new T.Mesh(humpGeo, new T.MeshBasicMaterial({
    color: 0x2f9fc4, transparent: true, opacity: 0.22, depthWrite: false, fog: false
  }));
  hump.scale.set(15, 2.6, 22);
  hump.position.set(-40, 0.4, 0);
  hump.renderOrder = 2;
  GH.add(hump);

  // 风（东北信风 / 东南信风）
  const hWind = [];
  for (let i = 0; i < 6; i++) hWind.push(A.windMark(0xdff2ff, { opacity: 0.6 }));
  // 三支洋流（波浪箭头）
  const aN = A.wave(0xff8a63, { opacity: 0.95 });
  const aS = A.wave(0xff8a63, { opacity: 0.95 });
  const aE = A.wave(0x7df5b5, { opacity: 1 });
  const aP = A.arrow(0xb46cf0, { opacity: 0.55 });

  const hLabels = [
    A.label('北赤道暖流 · 西流', 'amber'),
    A.label('南赤道暖流 · 西流', 'amber'),
    A.label('赤道逆流 · 东流（水平补偿）', 'green'),
    A.label('东北信风', 'dim'),
    A.label('东南信风', 'dim'),
    A.label('西部水位抬高', 'cyan'),
    A.label('赤道海区水位低', 'dim')
  ];
  hLabels.forEach((l) => { l.kind = 'h'; });

  A.curGroup = G;

  /* ---------------- 水平场景更新 ---------------- */
  const _h = new T.Vector3();
  function updateH(dt) {
    seaMat.uniforms.uT.value = S.t;
    const w = A.clamp(S.offshore / 12, 0.15, 1.3);

    for (let i = 0; i < hWind.length; i++) {
      const row = i < 3 ? 1 : -1;
      const k = i % 3;
      const x = 30 - ((S.t * (7 + 7 * w) + k * 26) % 78);
      _h.set(x, 7.5, row * (12 + k * 1.5));
      hWind[i].setWind(_h, new T.Vector3(-1, 0, 0), 14, 0.85);
      hWind[i].setOpacity(0.34 + w * 0.5);
    }

    aN.setArrow(new T.Vector3(40, 2.2, 13), new T.Vector3(-1, 0, 0), 64, 0.42, 0.42);
    aS.setArrow(new T.Vector3(40, 2.2, -13), new T.Vector3(-1, 0, 0), 64, 0.42, 0.42);
    aE.setArrow(new T.Vector3(-34, 2.6, 0), new T.Vector3(1, 0, 0), 60, 0.5, 0.56);
    aE.setOpacity(0.35 + w * 0.6);

    _h.set(2, 0.8, 0);
    aP.setArrow(_h, new T.Vector3(1, 0, 0), 16 + w * 8, 0.3);
    aP.setOpacity(0.18 + w * 0.3);

    hLabels[0].pos.set(-4, 2.4, 13); hLabels[0].off = [0, 19];
    hLabels[1].pos.set(-4, 2.4, -13); hLabels[1].off = [0, -18];
    hLabels[2].pos.set(6, 3.0, 0); hLabels[2].off = [0, -20];
    hLabels[3].pos.set(24, 8.2, 13.5);
    hLabels[4].pos.set(24, 8.2, -13.5);
    hLabels[5].pos.set(-40, 3.4, 0);
    hLabels[6].pos.set(34, 2.6, 0);
    hLabels[5].off = [0, -22];
    hLabels[6].off = [0, -18];
  }

  function setKind(k) {
    S.compKind = k;
    GV.visible = k === 'v';
    GH.visible = k === 'h';
    if (A.goView) A.goView(k === 'h' ? 'comph' : 'comp');
  }
  A.compKind = setKind;

  A.comp = { G, GV, GH, update, updateH, windNow, setKind };
})();
