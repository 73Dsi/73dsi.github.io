<script>
/* ============ 第四幕：全球联动 ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;
  const G = A.group('globe');

  const R = 1.0;

  /* ---------- 数据：统一来自 currents.json（严格对照课本图 4-16） ---------- */
  const CUR = (A.CUR = window.CUR_DATA);

  // 直布罗陀、曼德海峡这类海峡尺度的密度流画得细，只在「全部」和「密度流」下出现
  A.curVisible = function (c) { return !c.hidden || S.filter === 'dens' || S.filter === 'all'; };
  // 筛选：按成因时比 t，按性质时比 k（暖流 / 寒流）
  A.curMatch = function (c) {
    if (S.filter === 'all') return true;
    if (S.filter === 'warm' || S.filter === 'cold') return c.k === S.filter;
    return c.t === S.filter;
  };
  A.visibleCur = function () { return CUR.filter(A.curVisible); };

  // 同名洋流视为一条：所有南赤道暖流一起高亮，北赤道暖流、赤道逆流各算各的
  A.selSet = function (id) {
    const c = CUR.find((x) => x.id === id);
    if (!c) return [];
    return CUR.filter((x) => x.n === c.n).map((x) => x.id);
  };
  A.isSel = function (id) { return (S.selIds || S.sel === id) && (S.selIds ? S.selIds.indexOf(id) >= 0 : S.sel === id); };

  const typeColor = { wind: A.C.wind, dens: A.C.dens, comp: A.C.comp };
  const natColor = { warm: A.C.warm, cold: A.C.cold, neutral: 0xc8d2e0 };
  A.typeColor = typeColor;
  A.natColor = natColor;

  /* ---------- 地球 ---------- */
  const globe = new T.Group();
  G.add(globe);

  const wc = A.worldCanvas(2048, 1024, {
    oceanTop: '#0a2b40', oceanMid: '#06192a', oceanBot: '#04121d',
    land: '#3d7c96', landHi: 'rgba(150,220,240,0.55)', coast: '#c2f4ff', coastAlpha: 0.95
  });
  const landTex = new T.CanvasTexture(wc.cv);
  landTex.colorSpace = T.SRGBColorSpace;
  landTex.anisotropy = 4;

  const baseMat = new T.ShaderMaterial({
    fog: false,
    uniforms: { uMap: { value: landTex } },
    vertexShader: 'varying vec2 vUv; varying vec3 vN; varying vec3 vV;\n' +
      'void main(){ vUv=uv; vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.0); vV=-mv.xyz; gl_Position=projectionMatrix*mv; }',
    fragmentShader: 'uniform sampler2D uMap; varying vec2 vUv; varying vec3 vN; varying vec3 vV;\n' +
      'void main(){\n' +
      '  vec3 base = texture2D(uMap, vUv).rgb;\n' +
      '  vec3 N = normalize(vN);\n' +
      '  float lam = clamp(dot(N, normalize(vec3(-0.45,0.55,0.70))), 0.0, 1.0);\n' +
      '  vec3 col = base * (0.46 + 0.78*lam);\n' +
      '  float f = pow(1.0 - abs(dot(N, normalize(vV))), 2.6);\n' +
      '  col += vec3(0.12,0.36,0.50) * f * 0.8;\n' +
      '  gl_FragColor = vec4(col, 1.0);\n' +
      '}'
  });
  globe.add(new T.Mesh(new T.SphereGeometry(R, 96, 64), baseMat));

  // 大气辉光外壳已移除：它会在极区上空形成一圈额外的同心圆，容易误认成地理要素

  function toVec(lon, lat, r) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    return new T.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  }
  A.toVec = toVec;

  /* ---------- 经纬网 ---------- */
  const gratMat = new T.LineBasicMaterial({ color: 0x63c3e0, transparent: true, opacity: 0.16, fog: false });
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = [];
    for (let lon = -180; lon <= 180; lon += 4) pts.push(toVec(lon, lat, R * 1.002));
    const g = new T.BufferGeometry().setFromPoints(pts);
    globe.add(new T.Line(g, gratMat));
  }
  for (let lon = -180; lon < 180; lon += 30) {
    const pts = [];
    for (let lat = -88; lat <= 88; lat += 4) pts.push(toVec(lon, lat, R * 1.002));
    const g = new T.BufferGeometry().setFromPoints(pts);
    globe.add(new T.Line(g, gratMat));
  }
  // 赤道加粗
  (function () {
    const pts = [];
    for (let lon = -180; lon <= 180; lon += 3) pts.push(toVec(lon, 0, R * 1.003));
    globe.add(new T.Line(new T.BufferGeometry().setFromPoints(pts),
      new T.LineBasicMaterial({ color: 0x8fe0ff, transparent: true, opacity: 0.35, fog: false })));
  })();

  /* ---------- 洋流 ---------- */
  const pickables = [];
  const items = [];
  const CONE_GEO = new T.ConeGeometry(1, 1, 10, 1, false);
  CONE_GEO.translate(0, -0.45, 0);   // 尖端朝 +Y，原点在锥体中后部

  CUR.forEach((c) => {
    const pts = c.p.map((q) => toVec(q[0], q[1], R * 1.014));
    const raw = new T.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
    // 密采样后重新贴回球面，避免弦线切进球体
    const samp = raw.getPoints(Math.max(80, pts.length * 24)).map((v) => v.clone().normalize().multiplyScalar(R * 1.014));
    const curve = new T.CatmullRomCurve3(samp, false, 'catmullrom', 0.05);
    const rad = c.w >= 3 ? 0.0090 : c.w === 2 ? 0.0068 : 0.0050;
    const geo = new T.TubeGeometry(curve, Math.max(30, pts.length * 14), rad, 7, false);
    const mat = new T.MeshBasicMaterial({
      color: typeColor[c.t], transparent: true, opacity: 0.92, depthWrite: false, fog: false
    });
    const mesh = new T.Mesh(geo, mat);
    mesh.userData.cid = c.id;
    mesh.renderOrder = 4;
    globe.add(mesh);

    const pickGeo = new T.TubeGeometry(curve, Math.max(24, pts.length * 10), Math.max(0.042, rad * 2.6), 5, false);
    const pickMesh = new T.Mesh(pickGeo, new T.MeshBasicMaterial({
      transparent: true, opacity: 0, depthWrite: false, colorWrite: false, fog: false
    }));
    pickMesh.userData.cid = c.id;
    pickMesh.renderOrder = 3;
    globe.add(pickMesh);
    pickables.push(pickMesh);

    mesh.visible = A.curVisible(c);
    let marker = null;
    if (c.t === 'dens') {
      marker = new T.Mesh(
        new T.SphereGeometry(0.03, 14, 14),
        new T.MeshBasicMaterial({ color: typeColor[c.t], transparent: true, opacity: 0.95, fog: false })
      );
      marker.position.copy(curve.getPointAt(0.5));
      marker.userData.cid = c.id;
      globe.add(marker);
      pickables.push(marker);
    }

    // 方向锥
    const nCone = c.w >= 3 ? 3 : 2;
    const cones = [];
    for (let k = 0; k < nCone; k++) {
      const u = (k + 1) / (nCone + 1);
      const p = curve.getPointAt(u);
      const tan = curve.getTangentAt(u).normalize();
      const cm = new T.Mesh(CONE_GEO, mat);
      cm.position.copy(p);
      cm.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), tan);
      const sc = Math.max(0.020, rad * 3.0);
      cm.scale.set(sc * 0.62, sc * 1.5, sc * 0.62);
      cm.renderOrder = 5;
      globe.add(cm);
      cones.push(cm);
    }

    const lab = A.label(c.n, 'cur');
    lab.pos.copy(curve.getPointAt(0.5)).multiplyScalar(1.012);
    lab.on = false;
    lab.off = [0, -12];

    items.push({ c, curve, mesh, marker, mat, cones, base: typeColor[c.t], lab, mid: curve.getPointAt(0.5).clone() });
  });

  /* ---------- 流动光点 ---------- */
  const NPT = 3;
  const flowPos = new Float32Array(items.length * NPT * 3);
  const flowCol = new Float32Array(items.length * NPT * 3);
  const flowGeo = new T.BufferGeometry();
  flowGeo.setAttribute('position', new T.BufferAttribute(flowPos, 3));
  flowGeo.setAttribute('color', new T.BufferAttribute(flowCol, 3));
  const flowMat = new T.PointsMaterial({
    size: 0.026, map: A.dot, vertexColors: true, transparent: true, opacity: 0.85,
    depthWrite: false, blending: T.AdditiveBlending, sizeAttenuation: true, fog: false
  });
  const flowPts = new T.Points(flowGeo, flowMat);
  flowPts.frustumCulled = false;
  globe.add(flowPts);

  /* ---------- 星空 ---------- */
  const starGeo = new T.BufferGeometry();
  const sc = 1200, sp = new Float32Array(sc * 3);
  for (let i = 0; i < sc; i++) {
    const v = new T.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1).normalize().multiplyScalar(30 + Math.random() * 20);
    sp[i * 3] = v.x; sp[i * 3 + 1] = v.y; sp[i * 3 + 2] = v.z;
  }
  starGeo.setAttribute('position', new T.BufferAttribute(sp, 3));
  const stars = new T.Points(starGeo, new T.PointsMaterial({
    color: 0x9fc8e0, size: 1.3, sizeAttenuation: false, transparent: true, opacity: 0.5, fog: false, depthWrite: false
  }));
  G.add(stars);

  /* ---------- 四大渔场（叠加层） ---------- */
  const fishGroup = new T.Group();
  fishGroup.visible = false;
  globe.add(fishGroup);
  const fishItems = (A.FISHERIES || []).map((f) => {
    const p = toVec(f.lon, f.lat, R * 1.028);
    const ring = new T.Mesh(
      new T.RingGeometry(0.0075, 0.0135, 24),
      new T.MeshBasicMaterial({ color: 0x7df5b5, transparent: true, opacity: 0.9,
        depthWrite: false, side: T.DoubleSide, fog: false })
    );
    ring.position.copy(p);
    ring.quaternion.setFromUnitVectors(new T.Vector3(0, 0, 1), p.clone().normalize());
    ring.renderOrder = 6;
    fishGroup.add(ring);
    const dot = new T.Mesh(
      new T.SphereGeometry(0.0060, 12, 10),
      new T.MeshBasicMaterial({ color: 0xbfffd8, transparent: true, opacity: 0.95, depthWrite: false, fog: false })
    );
    dot.position.copy(p);
    dot.renderOrder = 6;
    fishGroup.add(dot);
    const lab = A.label(f.t, 'green');
    lab.pos.copy(toVec(f.lon, f.lat, R * 1.05));
    lab.off = [0, -14];
    lab.on = false;
    return { f, ring, dot, lab };
  });

  /* ---------- 选中地名标签 ---------- */
  const selLabel = A.label('', 'accent');
  selLabel.on = false;

  /* ---------- 刷新视觉状态 ---------- */
  // 按性质着色时，海峡尺度的密度流仍用紫色区分（图例里不列，只在地图上认得出）
  function colorOf(c) {
    if (S.globeColor === 'nature' && c.t === 'dens') return typeColor.dens;
    return S.globeColor === 'type' ? typeColor[c.t] : natColor[c.k];
  }
  function hiOf(c) {
    if (c.t === 'dens') return 0xd6b4ff;
    return c.k === 'warm' ? 0xffc49a : 0xa9ecff;
  }

  function refresh() {
    const multi = !!(S.selIds && S.selIds.length > 1);   // 同名洋流成组时各自标注
    let selTick = false;
    items.forEach((it, i) => {
      const c = it.c;
      const allowed = A.curVisible(c);
      const matchFilter = allowed && A.curMatch(c);
      const isSel = A.isSel(c.id);
      const dim = !matchFilter ? 0.09 : (S.sel && !isSel ? 0.34 : 0.98);
      const col = colorOf(c);
      it.base = col;
      it.mat.color.setHex(isSel ? hiOf(c) : col);
      it.mat.opacity = isSel ? 1 : dim;
      it.mesh.visible = allowed;
      it.cones.forEach((cm) => { cm.visible = matchFilter; });
      if (it.marker) {
        it.marker.material.color.setHex(isSel ? hiOf(c) : col);
        it.marker.material.opacity = isSel ? 1 : dim;
        it.marker.scale.setScalar(isSel ? 1.5 : 1.15);
        it.marker.visible = allowed;
      }
      for (let k = 0; k < NPT; k++) {
        const idx = (i * NPT + k) * 3;
        const cc = new T.Color(isSel ? (it.c.t === 'dens' ? 0xe4cdff : it.c.k === 'warm' ? 0xffd2b0 : 0xc6f2ff) : col);
        flowCol[idx] = cc.r; flowCol[idx + 1] = cc.g; flowCol[idx + 2] = cc.b;
      }
      // 选中项用高亮标签，其它同名拖影由 isSel 统一控制，避免出现两个一样的名字
      it.lab.el.style.display = (isSel && !multi) ? 'none' : '';
      if (isSel && !multi && !selTick) {
        selTick = true;
        selLabel.on = true;
        selLabel.el.textContent = c.n;
        selLabel.pos.copy(it.curve.getPointAt(0.5)).multiplyScalar(1.03);
        selLabel.off = [0, -20];
      }
    });
    const fishOn = !!S.overlay && S.mode === 'globe' && S.gview === 'globe';
    fishGroup.visible = fishOn;
    fishItems.forEach((it) => { it.lab.on = fishOn; });
    flowGeo.attributes.color.needsUpdate = true;
    if (!selTick) selLabel.on = false;
    if (A.onSelectCurrent) A.onSelectCurrent(S.sel);
  }
  A.globeRefresh = refresh;

  /* ---------- 选择 ---------- */
  function select(id, force) {
    // 点同一条洋流＝取消选中；从链接跳转（force）时始终选中
    if (id && !force && S.sel === id) id = null;
    S.sel = id;
    S.selIds = id ? A.selSet(id) : null;
    refresh();
    // 不自动转动地球：保持用户当前的观察角度
  }
  A.globeSelect = select;
  A.globeFocus = function (id) {
    const c = CUR.find((x) => x.id === id);
    // 跳回去时不能把它筛掉：本来就看得见就保持原筛选，否则切到它所属的那一类
    if (c && !(A.curVisible(c) && A.curMatch(c))) {
      S.filter = c.hidden ? 'dens' : (S.globeColor === 'nature' ? c.k : c.t);
    }
    if (A.setMode) A.setMode('globe');
    select(id, true);
  };

  const _ray = new T.Raycaster();
  function pickAt(e) {
    const ndc = new T.Vector2(
      (e.clientX / window.innerWidth) * 2 - 1,
      -(e.clientY / window.innerHeight) * 2 + 1
    );
    _ray.setFromCamera(ndc, A.camera);
    const hit = _ray.intersectObjects(pickables, false);
    for (let i = 0; i < hit.length; i++) {
      const id = hit[i].object.userData.cid;
      const c = CUR.find((x) => x.id === id);
      if (c && A.curVisible(c) && A.curMatch(c)) return id;   // 淡显的洋流点不中
    }
    return null;
  }

  // 屏幕最近点兜底（命中更宽容）
  const _pv = new T.Vector3();
  function nearest(e, maxD) {
    let best = null, bd = maxD;
    const cp = A.camera.position;
    items.forEach((it) => {
      if (!A.curVisible(it.c) || !A.curMatch(it.c)) return;   // 只认当前筛选下的洋流
      for (let i = 0; i <= 12; i++) {
        const p = it.curve.getPointAt(i / 12);
        if (p.clone().normalize().dot(cp.clone().normalize()) < 0.12) continue;  // 背面
        _pv.copy(p).project(A.camera);
        const sx = (_pv.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-_pv.y * 0.5 + 0.5) * window.innerHeight;
        const d = Math.hypot(sx - e.clientX, sy - e.clientY);
        if (d < bd) { bd = d; best = it.c.id; }
      }
    });
    return best;
  }
  A.pickAt = pickAt;

  A.onPick = function (e) {
    if (S.mode !== 'globe' || S.gview !== 'globe') return;
    let id = pickAt(e);
    if (!id) id = nearest(e, 22);
    if (id) select(id);            // 同一条再点一次＝取消
    else select(null, false);
  };

  A.onHover = function (e) {
    if (S.mode !== 'globe' || S.gview !== 'globe') { document.body.style.cursor = ''; return; }
    let id = pickAt(e);
    if (!id) id = nearest(e, 22);
    document.body.style.cursor = id ? 'pointer' : '';
  };

  /* ---------- 更新 ---------- */
  function update(dt) {
    items.forEach((it, i) => {
      const allowed = A.curVisible(it.c);
      for (let k = 0; k < NPT; k++) {
        const idx = (i * NPT + k) * 3;
        if (!allowed) { flowPos[idx] = 0; flowPos[idx + 1] = 0; flowPos[idx + 2] = 0; continue; }
        const u = (S.t * 0.09 + k / NPT + i * 0.137) % 1;
        const p = it.curve.getPointAt(u);
        flowPos[idx] = p.x; flowPos[idx + 1] = p.y; flowPos[idx + 2] = p.z;
      }
    });
    flowGeo.attributes.position.needsUpdate = true;

    const inGlobe = S.gview === 'globe';
    const cp = A.camera.position;
    const cl = Math.sqrt(cp.x * cp.x + cp.y * cp.y + cp.z * cp.z) || 1;
    items.forEach((it) => {
      const okFilter = A.curVisible(it.c) && A.curMatch(it.c);
      const d = (it.mid.x * cp.x + it.mid.y * cp.y + it.mid.z * cp.z) / (it.mid.length() * cl);
      it.lab.on = inGlobe && okFilter && d > 0.52;
    });
  }

  A.globe = { G, update, select, items };
})();

<script>
/* ============ 第五幕：平面世界地图 ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;

  const cv = document.getElementById('flatmap');
  const ctx = cv.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let base = null;          // 预渲染的海陆底图
  let geo = null;           // 绘图区
  let hoverId = null;

  /* ---------- 底图 ---------- */
  function buildBase() {
    const wc = A.worldCanvas(2048, 1024, {
      oceanTop: '#0b2f47', oceanMid: '#071d2d', oceanBot: '#05131e',
      land: '#3d7c96', landHi: 'rgba(150,220,240,0.55)', coast: '#c2f4ff', coastAlpha: 0.95
    });
    base = wc.cv;
  }

  /* ---------- 尺寸 ---------- */
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';

    const mob = W < 980;
    const land = W > H && H < 560;                       // 手机横屏：面板在右侧，顶栏压扁
    // 说明条会随内容变高，按它的真实位置来留白，图注就不会压上去
    const dockEl = document.getElementById('dock');
    const dockTop = dockEl && dockEl.offsetHeight ? dockEl.getBoundingClientRect().top : H - 120;
    const botRoom = Math.max(64, Math.round(H - dockTop) + 34);   // 34 = 图注一行 + 间距
    let padL, padR, padT, padB;
    // 地图外框会向外扩 14px，留白要把它让出来，否则边框贴边会被裁掉
    if (land) {
      // 地图固定居中铺满，面板打开时压在上面（关闭后自然不挡）
      padL = 22; padR = 22;
      padT = 48; padB = botRoom;
    }
    else if (mob) { padL = 22; padR = 22; padT = 132; padB = Math.max(botRoom, 150); }
    else { padL = 262; padR = 348; padT = 74; padB = Math.max(botRoom, 96); }
    padB = Math.min(padB, Math.max(60, H - padT - 90));     // 别把地图压没
    let w = Math.max(240, W - padL - padR);   // 原来写死 420，窄屏直接被撑出屏幕
    let h = w / 2;
    const maxH = H - padT - padB;
    if (h > maxH) { h = maxH; w = h * 2; }
    geo = {
      x: Math.round(padL + (W - padL - padR - w) / 2),
      y: Math.round(padT + (maxH - h) / 2),
      w: Math.round(w), h: Math.round(h)
    };
  }

  const X = (lon) => geo.x + (lon + 180) / 360 * geo.w;
  const Y = (lat) => geo.y + (90 - lat) / 180 * geo.h;

  /* 地图层与标签层：标签不参与缩放，字号始终不变 */
  const Z = { k: 1, x: 0, y: 0 };
  const SX = (lon) => {
    const mcx = geo.x + geo.w / 2;
    return mcx + Z.x + (X(lon) - mcx) * Z.k;
  };
  const SY = (lat) => {
    const mcy = geo.y + geo.h / 2;
    return mcy + Z.y + (Y(lat) - mcy) * Z.k;
  };

  /* ---------- 序贯经度 ---------- */
  function seqLon(pts) {
    const out = [[pts[0][0], pts[0][1]]];
    for (let i = 1; i < pts.length; i++) {
      let prev = out[i - 1][0];
      let dl = pts[i][0] - prev;
      while (dl > 180) dl -= 360;
      while (dl < -180) dl += 360;
      out.push([prev + dl, pts[i][1]]);
    }
    return out;
  }

  function sampleCatmull(seq, n) {
    const out = [];
    for (let i = 0; i < seq.length - 1; i++) {
      const p0 = seq[Math.max(0, i - 1)], p1 = seq[i], p2 = seq[i + 1], p3 = seq[Math.min(seq.length - 1, i + 2)];
      for (let k = 0; k < n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        const lon = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
        const lat = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
        out.push([lon, lat]);
      }
    }
    out.push([seq[seq.length - 1][0], seq[seq.length - 1][1]]);
    return out;
  }

  const CACHE = {};
  function pathOf(c) {
    if (!CACHE[c.id]) CACHE[c.id] = sampleCatmull(seqLon(c.p), 12);
    return CACHE[c.id];
  }

  function colorOf(c) {
    if (S.globeColor === 'nature' && c.t === 'dens') return A.typeColor.dens;
    return S.globeColor === 'type' ? A.typeColor[c.t] : A.natColor[c.k];
  }
  function css(hex, a) {
    const r = (hex >> 16) & 255, g = (hex >> 8) & 255, b = hex & 255;
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  /* ---------- 绘制 ---------- */
  A.mapZoom = function () { Z.k = 1; Z.x = 0; Z.y = 0; draw(); };

  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    if (!geo) layout();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 外框
    ctx.save();
    ctx.beginPath();
    roundRect(geo.x - 14, geo.y - 14, geo.w + 28, geo.h + 28, 16);
    ctx.fillStyle = 'rgba(8,18,28,.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,230,.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    // 缩放 / 平移层（只放地图要素，文字另画在屏幕坐标系里）
    const mcx = geo.x + geo.w / 2, mcy = geo.y + geo.h / 2;
    ctx.save();
    ctx.beginPath();
    roundRect(geo.x, geo.y, geo.w, geo.h, 3);
    ctx.clip();
    ctx.translate(mcx + Z.x, mcy + Z.y);
    ctx.scale(Z.k, Z.k);
    ctx.translate(-mcx, -mcy);

    // 海陆底图
    if (!base) buildBase();
    ctx.drawImage(base, geo.x, geo.y, geo.w, geo.h);

    // 纬度刻度
    ctx.save();
    ctx.font = '8.5px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(160,205,225,.4)';
    ctx.textBaseline = 'middle';
    [60, 30, 0, -30, -60].forEach((lat) => {
      ctx.fillText((lat === 0 ? '0°' : Math.abs(lat) + '°' + (lat > 0 ? 'N' : 'S')), geo.x - 22, Y(lat));
    });
    ctx.restore();

    // 洋流
    const t = S.t;
    A.CUR.forEach((c) => {
      if (!A.curVisible(c)) return;
      const matchFilter = A.curMatch(c);
      const isSel = A.isSel(c.id);
      const isHover = hoverId === c.id;
      const faded = !matchFilter && !isSel;          // 被筛掉的洋流淡显，仍然看得见走向
      const col = isSel ? 0xffffff : colorOf(c);
      const alpha = isSel ? 1 : faded ? 0.30 : (S.sel ? 0.52 : 0.95);
      const lw = c.w >= 3 ? 2.6 : c.w === 2 ? 1.9 : 1.35;
      // 放大时线宽和箭头按屏幕尺寸封顶，不然会变成一条粗管子
      const kS = Math.min(Z.k, 1.55) / Z.k;
      const pts = pathOf(c);

      let lo = 1e9, hi = -1e9;
      pts.forEach((q) => { if (q[0] < lo) lo = q[0]; if (q[0] > hi) hi = q[0]; });
      const wrapNeeded = lo < -180 || hi > 180;
      for (const shift of (wrapNeeded ? [-geo.w, 0, geo.w] : [0])) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(geo.x, geo.y, geo.w, geo.h);
        ctx.clip();

        ctx.beginPath();
        pts.forEach((p, i) => {
          const x = X(p[0]) + shift, y = Y(p[1]);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.strokeStyle = css(col, alpha * 0.16);
        ctx.lineWidth = lw * 3.4 * kS;
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.strokeStyle = css(col, alpha * (isHover ? 1 : 0.82));
        ctx.lineWidth = lw * kS;
        ctx.stroke();

        ctx.setLineDash([6, 13]);
        ctx.lineDashOffset = -((t * 34) % 19);
        ctx.strokeStyle = css(0xffffff, alpha * (isSel ? 0.95 : 0.5));
        ctx.lineWidth = Math.max(1 / Z.k, lw * 0.55 * kS);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      // 箭头
      if (alpha > 0.5) {
        const us = c.w >= 3 ? [0.3, 0.62, 0.88] : [0.45, 0.85];
        us.forEach((u) => {
          const i = Math.min(pts.length - 1, Math.round(u * (pts.length - 1)));
          const p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)];
          let x = X(p[0]), y = Y(p[1]);
          let dx = X(q[0]) - x, dy = Y(q[1]) - y;
          const len = Math.hypot(dx, dy) || 1;
          dx /= len; dy /= len;
          const s = (c.w >= 3 ? 7 : 5.4) * kS;
          ctx.beginPath();
          ctx.moveTo(x + dx * s, y + dy * s);
          ctx.lineTo(x - dy * s * 0.72 - dx * s * 0.5, y + dx * s * 0.72 - dy * s * 0.5);
          ctx.lineTo(x + dy * s * 0.72 - dx * s * 0.5, y - dx * s * 0.72 - dy * s * 0.5);
          ctx.closePath();
          ctx.fillStyle = css(col, alpha);
          ctx.fill();
        });
      }
    });

    if (S.overlay) drawPinMarks();

    ctx.restore();

    /* ------- 以下在屏幕坐标系里绘制：字号固定，不随缩放变大 ------- */
    if (S.overlay) drawOverlayLabels();
    drawLabels();

    // 小标题
    ctx.save();
    ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(150,190,210,.75)';
    if (W >= 980) ctx.fillText(S.globeColor === 'type' ? '按成因着色' : '按性质着色', geo.x, geo.y - 24);
    ctx.fillStyle = 'rgba(120,160,180,.55)';
    if (W >= 980) ctx.fillText(Z.k > 1.02 ? '拖动平移 · 滚轮缩放 · 双击复位' : '滚轮放大画面，文字大小不变 · 点击洋流看成因', geo.x + 88, geo.y - 24);

    // 地图下方图注：对齐课本图 4-16
    const shown = A.CUR.filter((c) => A.curVisible(c) && A.curMatch(c)).length;
    const colTxt = S.globeColor === 'type'
      ? '风海流橙 · 密度流紫 · 补偿流绿'
      : '暖流橙红 · 寒流青蓝';
    ctx.fillStyle = 'rgba(150,190,210,.5)';
    if (geo.w < 640) {
      // 窄屏：图注压成一行短句，既不重叠也不会超出屏幕
      ctx.font = '9.5px "PingFang SC","Microsoft YaHei",sans-serif';
      let t = '图 4-16　世界表层洋流 · 共 ' + shown + ' 条';
      while (ctx.measureText(t).width > geo.w - 6 && t.length > 8) t = t.slice(0, -2);
      ctx.fillText(t, geo.x, geo.y + geo.h + 26);
    } else {
      ctx.fillText('参考课本 图 4-16　世界海洋表层洋流分布（北半球冬季）· 图上共 ' + shown + ' 条', geo.x, geo.y + geo.h + 34);
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(120,160,180,.42)';
      ctx.fillText(colTxt + '　箭头为流向', geo.x + geo.w, geo.y + geo.h + 34);
      ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  /* ================= 洋流名称：屏幕坐标 + 自动避让 ================= */
  function labelCandidates(ax, ay, w, h) {
    return [
      [0, -h / 2 - 9], [0, h / 2 + 9],
      [0, -h / 2 - 21], [0, h / 2 + 21],
      [-(w * 0.5 + 8), 0], [w * 0.5 + 8, 0],
      [-(w * 0.34), -h / 2 - 15], [w * 0.34, -h / 2 - 15],
      [-(w * 0.34), h / 2 + 15], [w * 0.34, h / 2 + 15]
    ];
  }

  function drawLabels() {
    const placed = [];
    const fs = 10.5, hh = 15;
    ctx.font = '500 ' + fs + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textBaseline = 'middle';

    const list = A.visibleCur()
      .filter((c) => A.curMatch(c) || A.isSel(c.id))
      .sort((a, b) => (b.w - a.w) || (a.n.length - b.n.length));

    let skipped = 0;

    list.forEach((c) => {
      const pts = pathOf(c);
      let ai = Math.round((pts.length - 1) * 0.5), bestD = 1e9;
      if (c.lp) {
        for (let i = 0; i < pts.length; i++) {
          const d = Math.hypot(pts[i][0] - c.lp[0], pts[i][1] - c.lp[1]);
          if (d < bestD) { bestD = d; ai = i; }
        }
      }
      const p = pts[ai];

      // 跨 180° 的洋流：挑一个落在画面里的经度副本
      let bestShift = 0, bestScore = -1e9;
      for (const sh of [0, -360, 360]) {
        const x = SX(p[0] + sh);
        if (x < geo.x + 6 || x > geo.x + geo.w - 6) continue;
        const score = -Math.abs(x - (geo.x + geo.w / 2));
        if (score > bestScore) { bestScore = score; bestShift = sh; }
      }
      const ax = SX(p[0] + bestShift), ay = SY(p[1]);
      if (ax < geo.x || ax > geo.x + geo.w) { skipped++; return; }

      const isSel = A.isSel(c.id);
      const tw = ctx.measureText(c.n).width;
      const w = tw + 12, h = hh;

      let box = null;
      for (const cand of labelCandidates(ax, ay, w, h)) {
        const b = { x: ax + cand[0] - w / 2, y: ay + cand[1] - h / 2, w, h };
        if (b.x < geo.x + 3 || b.x + b.w > geo.x + geo.w - 3) continue;
        if (b.y < geo.y + 3 || b.y + b.h > geo.y + geo.h - 3) continue;
        let clash = false;
        for (let i = 0; i < placed.length; i++) {
          const q = placed[i];
          if (!(b.x > q.x + q.w + 2 || b.x + b.w + 2 < q.x || b.y > q.y + q.h + 2 || b.y + b.h + 2 < q.y)) { clash = true; break; }
        }
        if (clash) continue;
        box = b;
        break;
      }
      if (!box) {
        if (isSel) box = { x: Math.max(geo.x + 2, Math.min(geo.x + geo.w - w - 2, ax - w / 2)), y: ay - h / 2, w, h };
        else { skipped++; return; }
      }
      placed.push(box);

      // 引线
      const cxc = box.x + box.w / 2, cyc = box.y + box.h / 2;
      if (Math.abs(cyc - ay) > 20 || Math.abs(cxc - ax) > 24) {
        ctx.strokeStyle = css(colorOf(c), isSel ? 0.5 : 0.28);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(cxc, cyc);
        ctx.stroke();
      }

      const col = isSel ? 0xffffff : colorOf(c);
      ctx.beginPath();
      roundRect(box.x, box.y, box.w, box.h, 4);
      ctx.fillStyle = isSel ? 'rgba(10,26,38,.94)' : 'rgba(4,10,16,.74)';
      ctx.fill();
      ctx.strokeStyle = css(col, isSel ? 0.9 : 0.3);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = css(col, S.sel && !isSel ? 0.55 : 0.96);
      ctx.fillText(c.n, box.x + 6, box.y + box.h / 2 + 0.5);
    });

    if (skipped > 0 && Z.k < 1.6) {
      ctx.font = '10px "PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(140,180,200,.5)';
      ctx.textAlign = 'right';
      ctx.fillText('另有 ' + skipped + ' 个名称待放大显示', geo.x + geo.w - 8, geo.y + geo.h - 10);
      ctx.textAlign = 'left';
    }
  }

  /* ================= 四大渔场（数据在 core.js） ================= */
  const PINS = A.FISHERIES;

  function drawPinMarks() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(geo.x, geo.y, geo.w, geo.h);
    ctx.clip();
    PINS.forEach((p) => {
      const x = X(p.lon), y = Y(p.lat);
      const col = 'rgba(125,245,181,';
      const s = 1 / Math.max(0.55, Math.min(1.6, Math.sqrt(Z.k)));
      ctx.fillStyle = col + '0.16)';
      ctx.beginPath(); ctx.arc(x, y, 9 * s, 0, 6.28); ctx.fill();
      ctx.fillStyle = col + '0.95)';
      ctx.beginPath(); ctx.arc(x, y, 3.1 * s, 0, 6.28); ctx.fill();
      ctx.strokeStyle = col + '0.4)'; ctx.lineWidth = 1 / Z.k;
      ctx.beginPath(); ctx.arc(x, y, 6.5 * s, 0, 6.28); ctx.stroke();
    });
    ctx.restore();
  }

  function drawOverlayLabels() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(geo.x, geo.y, geo.w, geo.h);
    ctx.clip();

    ctx.font = '10px "PingFang SC",sans-serif';
    ctx.textBaseline = 'middle';
    PINS.forEach((p) => {
      const x = SX(p.lon), y = SY(p.lat);
      if (x < geo.x || x > geo.x + geo.w) return;
      const col = 'rgba(125,245,181,';
      const side = p.side || (x > geo.x + geo.w * 0.7 ? -1 : 1);
      const tx = x + side * 13, ty = y + (p.oy || 0);
      ctx.fillStyle = col + '0.94)';
      ctx.textAlign = side > 0 ? 'left' : 'right';
      ctx.fillText(p.t, tx, ty - 1);
      ctx.fillStyle = 'rgba(170,205,225,.55)';
      ctx.font = '9px "PingFang SC",sans-serif';
      ctx.fillText(p.s, tx, ty + 11);
      ctx.font = '10px "PingFang SC",sans-serif';
      ctx.textAlign = 'left';
    });
    ctx.restore();
  }

  /* ---------- 命中 ---------- */
  function hit(e) {
    if (!geo) return null;
    const mcx = geo.x + geo.w / 2, mcy = geo.y + geo.h / 2;
    const px = (e.clientX - (mcx + Z.x)) / Z.k + mcx;
    const py = (e.clientY - (mcy + Z.y)) / Z.k + mcy;
    let best = null, bestD = 12 / Z.k;
    A.CUR.forEach((c) => {
      if (!A.curVisible(c)) return;
      if (!A.curMatch(c)) return;
      const pts = pathOf(c);
      for (let shift = -1; shift <= 1; shift++) {
        for (let i = 0; i < pts.length - 1; i++) {
          const x1 = X(pts[i][0]) + shift * geo.w, y1 = Y(pts[i][1]);
          const x2 = X(pts[i + 1][0]) + shift * geo.w, y2 = Y(pts[i + 1][1]);
          if (Math.max(x1, x2) < geo.x - 40 || Math.min(x1, x2) > geo.x + geo.w + 40) continue;
          const d = segDist(px, py, x1, y1, x2, y2);
          if (d < bestD) { bestD = d; best = c.id; }
        }
      }
    });
    return best;
  }

  function segDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
  }

  /* ---------- 事件 ---------- */
  window.addEventListener('resize', () => { layout(); });

  /* ---------- 缩放 / 平移 ---------- */
  let drag = null, moved = 0;
  function zoomAt(mx, my, k2) {
    const mcx = geo.x + geo.w / 2, mcy = geo.y + geo.h / 2;
    const ux = (mx - (mcx + Z.x)) / Z.k + mcx;
    const uy = (my - (mcy + Z.y)) / Z.k + mcy;
    Z.k = k2;
    Z.x = mx - mcx - (ux - mcx) * k2;
    Z.y = my - mcy - (uy - mcy) * k2;
    const lim = geo.w * (k2 - 1) * 0.5, limY = geo.h * (k2 - 1) * 0.5;
    Z.x = Math.max(-lim, Math.min(lim, Z.x));
    Z.y = Math.max(-limY, Math.min(limY, Z.y));
    draw();
  }
  cv.addEventListener('wheel', (e) => {
    if (!(S.mode === 'globe' && S.gview !== 'globe')) return;
    e.preventDefault();
    const k2 = Math.max(1, Math.min(5, Z.k * (1 - e.deltaY * 0.0016)));
    zoomAt(e.clientX, e.clientY, k2);
  }, { passive: false });

  // 双指缩放
  const pinchPts = new Map();
  let pinchD = 0;
  cv.addEventListener('pointerdown', (e) => {
    if (!(S.mode === 'globe' && S.gview !== 'globe')) return;
    pinchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchPts.size === 2) {
      const [a, b] = [...pinchPts.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
      drag = null;
      return;
    }
    drag = { x: e.clientX, y: e.clientY }; moved = 0;
  });
  cv.addEventListener('pointermove', (e) => {
    if (S.mode !== 'globe' || S.gview === 'globe') return;
    if (pinchPts.has(e.pointerId)) pinchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchPts.size === 2) {
      const [a, b] = [...pinchPts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0 && d > 0) {
        const k2 = Math.max(1, Math.min(5, Z.k * (d / pinchD)));
        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, k2);
        moved = 99;                       // 双指后不要触发点选
      }
      pinchD = d;
      return;
    }
    if (drag && Z.k > 1) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 3) {
        Z.x += dx; Z.y += dy;
        const lim = geo.w * (Z.k - 1) * 0.5, limY = geo.h * (Z.k - 1) * 0.5;
        Z.x = Math.max(-lim, Math.min(lim, Z.x));
        Z.y = Math.max(-limY, Math.min(limY, Z.y));
        drag = { x: e.clientX, y: e.clientY };
        draw();
        cv.style.cursor = 'grabbing';
        return;
      }
    }
    const id = hit(e);
    hoverId = id;
    cv.style.cursor = id ? 'pointer' : 'default';
  });
  cv.addEventListener('pointerup', (e) => {
    pinchPts.delete(e.pointerId);
    if (pinchPts.size < 2) pinchD = 0;
    const wasDrag = moved > 6;
    drag = null; moved = 0;
    if (pinchPts.size > 0) return;
    if (S.mode !== 'globe' || S.gview === 'globe') { return; }
    if (wasDrag) return;
    const id = hit(e);
    A.globeSelect(id, false);
  });
  cv.addEventListener('dblclick', () => { if (Z.k > 1) A.mapZoom(); });

  A.mapZoomK = () => Z.k;      // 供调试/测试读取当前缩放
  A.map2d = {
    update() { if (S.mode === 'globe' && S.gview !== 'globe') draw(); },
    enter() { layout(); draw(); },
    colorOf
  };
  A.mapEnter = function () { layout(); draw(); };
})();

</script>
<script>
/* ============ 05 北印度洋季风洋流 ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;
  const cv = document.getElementById('monsoon');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, geo = null;

  const LON0 = 28, LON1 = 112, LAT0 = 32, LAT1 = -32;

  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    const mob = W < 980;
    const land = W > H && H < 560;
    const off = typeof document !== 'undefined' && document.body.classList.contains('pmin');
    const dockEl = document.getElementById('dock');
    const dockTop = dockEl && dockEl.offsetHeight ? dockEl.getBoundingClientRect().top : H - 120;
    const botRoom = Math.max(56, Math.round(H - dockTop) + 12);
    let padL, padR, TOP, BOT;
    if (land) {
      // 面板打开时把区域图整体让到左边（不溢出），关闭时居中
      const panelEl = document.getElementById('panel');
      const pw = (!off && panelEl) ? Math.round(panelEl.getBoundingClientRect().width) : 0;
      padL = 18;
      padR = off ? 18 : pw + 18;
      TOP = 34;
      BOT = H - botRoom;
    } else if (mob) {
      padL = 20; padR = 20; TOP = 128; BOT = H - Math.max(botRoom, 190);
    } else {
      padL = 262; padR = 348; TOP = 74; BOT = H - Math.max(botRoom, 96);
    }
    const bw = W - padL - padR;
    const bh = (BOT - 42) - (TOP + 62);
    const s = Math.min(bw / (LON1 - LON0), bh / (LAT0 - LAT1));
    const mw = (LON1 - LON0) * s, mh = (LAT0 - LAT1) * s;
    geo = { x: padL + (bw - mw) / 2, y: TOP + 62 + (bh - mh) / 2, w: mw, h: mh, s: s, top: TOP, bot: BOT };
    regionCv = null;
  }
  const Z = { k: 1, x: 0, y: 0 };                 // 季风区域图的缩放/平移
  function MP(x, y) {
    const mcx = geo.x + geo.w / 2, mcy = geo.y + geo.h / 2;
    return [mcx + Z.x + (x - mcx) * Z.k, mcy + Z.y + (y - mcy) * Z.k];
  }
  const X = (lon) => MP(geo.x + (lon - LON0) * geo.s, 0)[0];
  const Y = (lat) => MP(0, geo.y + (LAT0 - lat) * geo.s)[1];

  function txt(t, x, y, col, size, align, weight) {
    ctx.font = (weight || 400) + ' ' + (size || 11) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(t, x, y); ctx.textAlign = 'left';
  }
  function head(x, y, a, col, sz) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * sz, y + Math.sin(a) * sz);
    ctx.lineTo(x - Math.cos(a - 1.35) * sz * 0.86, y - Math.sin(a - 1.35) * sz * 0.86);
    ctx.lineTo(x - Math.cos(a + 1.35) * sz * 0.86, y - Math.sin(a + 1.35) * sz * 0.86);
    ctx.closePath(); ctx.fill();
  }

  /* ---------- 陆地：直接取全局海陆数据，按 28°E—112°E / 32°N—32°S 裁剪 ---------- */
  let regionCv = null;
  function buildRegion() {
    const FW = 4096, FH = 2048;
    const wc = A.worldCanvas(FW, FH, {
      noOcean: true,
      land: 'rgba(46,96,116,.95)', landHi: 'rgba(160,225,245,0.30)',
      coast: '#a8e8ff', coastAlpha: 0.8
    });
    const sx = (LON0 + 180) / 360 * FW, sw = (LON1 - LON0) / 360 * FW;
    const sy = (90 - LAT0) / 180 * FH, sh = (LAT0 - LAT1) / 180 * FH;
    const cv2 = document.createElement('canvas');
    const k = Math.min(2, window.devicePixelRatio || 1);
    cv2.width = Math.round(geo.w * k); cv2.height = Math.round(geo.h * k);
    const g2 = cv2.getContext('2d');
    g2.drawImage(wc.cv, sx, sy, sw, sh, 0, 0, cv2.width, cv2.height);
    regionCv = cv2;
  }

  function drawLand() {
    if (!regionCv) buildRegion();
    // 跟着缩放一起放大，海岸线和洋流的相对位置保持不变
    const p0 = MP(geo.x, geo.y);
    ctx.drawImage(regionCv, p0[0], p0[1], geo.w * Z.k, geo.h * Z.k);
  }

  /* ---------- 洋流（对照图 4-18 的夏季、冬季两幅） ---------- */
  // 冬季（东北季风）：逆时针
  const WIN = [
    { n: '南赤道暖流', k: 'warm', w: 2, l: [88, -11], p: [[104, -11], [92, -11], [80, -11], [68, -11], [56, -10], [47, -10]] },
    { n: '季风洋流', k: 'warm', w: 3, l: [72, 8.6], p: [[92, 19], [91, 15], [87, 11], [84, 8], [80, 5], [76, 5.2], [71, 6.5], [66, 7], [61, 5.5], [56, 3.5], [52, 2]] },
    { n: '索马里洋流', k: 'warm', w: 2, l: [54.5, 12.5], p: [[53, 12], [51, 8], [49, 4], [47, 0]] },
    { n: '赤道逆流', k: 'c-other', w: 2, l: [70, -2.5], p: [[45, -2], [58, -2], [70, -2.5], [84, -3], [96, -3]] }
  ];
  // 夏季（西南季风）：顺时针
  const SUM = [
    { n: '南赤道暖流', k: 'warm', w: 2, l: [88, -11], p: [[104, -11], [92, -11], [80, -11], [68, -11], [56, -10], [47, -10]] },
    { n: '索马里寒流', k: 'cold', w: 2, l: [55.5, 2.5], p: [[47, 0], [48.6, 4], [50.8, 8], [53, 11]] },
    { n: '季风洋流', k: 'warm', w: 3, l: [68, 16.5], p: [[50, -1], [52, 4], [57, 9], [63, 12], [70, 13], [75, 10], [78, 6.5], [81, 4.5], [84, 6], [86.5, 10], [88, 15], [87.5, 20]] }
  ];

  const KW = { warm: 'rgba(255,122,89,', cold: 'rgba(79,195,255,', 'c-other': 'rgba(125,245,181,' };

  function drawCur(list, alpha) {
    if (alpha <= 0.03) return;
    list.forEach((c) => {
      const pts = c.p.map((q) => [X(q[0]), Y(q[1])]);
      const col = KW[c.k];
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
      ctx.strokeStyle = col + (0.26 * alpha) + ')';
      ctx.lineWidth = Math.max(5, c.w * 2.6);
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.strokeStyle = col + (0.9 * alpha) + ')';
      ctx.lineWidth = Math.max(1.7, c.w * 0.95);
      ctx.setLineDash([7, 11]);
      ctx.lineDashOffset = -((S.t * 34) % 18);
      ctx.stroke();
      ctx.setLineDash([]);
      [0.42, 0.78].forEach((u) => {
        const fi = u * (pts.length - 1), i0 = Math.floor(fi), f = fi - i0;
        const p0 = pts[i0], p1 = pts[Math.min(pts.length - 1, i0 + 1)];
        const x = p0[0] + (p1[0] - p0[0]) * f, y = p0[1] + (p1[1] - p0[1]) * f;
        head(x, y, Math.atan2(p1[1] - p0[1], p1[0] - p0[0]), col + (0.95 * alpha) + ')', 6.5);
      });
      if (c.n) {
        const p = [X(c.l[0]), Y(c.l[1])];
        ctx.font = '10.5px "PingFang SC",sans-serif';
        const w = ctx.measureText(c.n).width + 10;
        ctx.fillStyle = 'rgba(4,10,16,' + (0.66 * alpha) + ')';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(p[0] - w / 2, p[1] - 8, w, 16, 4); else ctx.rect(p[0] - w / 2, p[1] - 8, w, 16);
        ctx.fill();
        txt(c.n, p[0], p[1] + 0.5, col + (0.95 * alpha) + ')', 10.5, 'center', 600);
      }
    });
  }

  /* ---------- 风 ---------- */
  const WPOS = [[52, 6], [60, 10], [68, 14], [76, 16], [84, 16], [92, 14],
    [56, -1], [66, 0], [76, -1], [86, -2], [52, -8], [64, -10], [78, -11], [92, -10]];

  function drawWind(alpha, dirX, dirY, col, label) {
    if (alpha <= 0.03) return;
    WPOS.forEach((p, i) => {
      const x = X(p[0]), y = Y(p[1]);
      const len = 17 + 5 * Math.sin(S.t * 2 + i);
      const a = Math.atan2(dirY, dirX);
      ctx.strokeStyle = col + (0.34 * alpha) + ')';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - dirX * len / 2, y - dirY * len / 2);
      ctx.lineTo(x + dirX * len / 2, y + dirY * len / 2);
      ctx.stroke();
      head(x + dirX * len / 2, y + dirY * len / 2, a, col + (0.5 * alpha) + ')', 5);
    });
    if (label) txt(label, geo.x + geo.w - 8, geo.y + 14, col + (0.8 * alpha) + ')', 11.5, 'right', 600);
  }

  function draw() {
    if (!geo) layout();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    const fx = Math.max(8, geo.x - 18), fw = Math.min(W - 8, geo.x + geo.w + 18) - fx;
    if (ctx.roundRect) ctx.roundRect(fx, geo.top, fw, geo.bot - geo.top, 16);
    else ctx.rect(fx, geo.top, fw, geo.bot - geo.top);
    ctx.fillStyle = 'rgba(8,18,28,.55)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,200,230,.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();

    const info = A.seasonInfo(S.month);
    const k = info.k;
    // 转换期两支环流都很弱，且同时可见（正在交替）
    const sum = A.clamp((k + 0.30) / 0.80, 0, 1);
    const win = A.clamp((-k + 0.30) / 0.80, 0, 1);

    // 海面
    ctx.save();
    ctx.beginPath(); ctx.rect(geo.x, geo.y, geo.w, geo.h); ctx.clip();
    const gg = ctx.createLinearGradient(0, geo.y, 0, geo.y + geo.h);
    gg.addColorStop(0, '#0d3348');
    gg.addColorStop(0.55, '#0a2436');
    gg.addColorStop(1, '#071925');
    ctx.fillStyle = gg;
    ctx.fillRect(geo.x, geo.y, geo.w, geo.h);
    ctx.strokeStyle = 'rgba(140,205,230,.10)';
    ctx.lineWidth = 1;
    [20, 10, -10, -20].forEach((lat) => {
      ctx.beginPath(); ctx.moveTo(geo.x, Y(lat)); ctx.lineTo(geo.x + geo.w, Y(lat)); ctx.stroke();
    });
    [40, 50, 60, 70, 80, 90, 100, 110].forEach((lon) => {
      ctx.beginPath(); ctx.moveTo(X(lon), geo.y); ctx.lineTo(X(lon), geo.y + geo.h); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(143,224,255,.30)';
    ctx.beginPath(); ctx.moveTo(geo.x, Y(0)); ctx.lineTo(geo.x + geo.w, Y(0)); ctx.stroke();

    drawLand();

    // 纬度读数（画在地图框外，不压水面）
    ctx.font = '9px "PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(165,205,225,.5)';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    [[20, '20°N'], [10, '10°N'], [0, '0°'], [-10, '10°S'], [-20, '20°S']].forEach((p) => {
      ctx.fillText(p[1], geo.x - 7, Y(p[0]));
    });
    ctx.textAlign = 'left';

    drawCur(WIN, win);
    drawCur(SUM, sum);

    // 夏季：赤道逆流消失
    if (sum > 0.5) {
      const p = [X(78), Y(-2.6)];
      txt('赤道逆流消失', p[0], p[1] - 18, 'rgba(125,245,181,' + (0.6 * (sum - 0.4) / 0.6) + ')', 10, 'center');
      ctx.strokeStyle = 'rgba(125,245,181,' + (0.35 * (sum - 0.4) / 0.6) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(p[0] - 36, p[1] - 8); ctx.lineTo(p[0] + 36, p[1] - 8); ctx.stroke();
    }

    // 索马里上升流（夏季）
    if (sum > 0.1) {
      for (let i = 0; i < 5; i++) {
        const u = (S.t * 0.35 + i / 5) % 1;
        const x = X(50.5) + Math.sin(i * 1.7) * 5;
        const y = Y(2) - u * 40;
        ctx.fillStyle = 'rgba(53,208,160,' + (0.7 * sum * (1 - u * 0.6)) + ')';
        ctx.beginPath(); ctx.arc(x, y, 2.1, 0, 6.28); ctx.fill();
      }
      txt('上升流', X(51.5) + 6, Y(9.4), 'rgba(53,208,160,' + (0.9 * sum) + ')', 10.5, 'left', 600);
    }

    drawWind(sum, 0.7, -0.7, 'rgba(150,225,255,', sum > 0.25 ? '西南季风' : '');
    drawWind(win, -0.7, 0.7, 'rgba(150,225,255,', win > 0.25 ? '东北季风' : '');

    ctx.restore();

    // 季节标签
    const head1 = info.cn + ' · ' + info.dir;
    txt(head1, geo.x + geo.w / 2, geo.top + 44, info.tint, 13.5, 'center', 700);
    txt('北印度洋 · 洋流随季风一年反转两次', geo.x + geo.w / 2, geo.top + 23, 'rgba(160,200,220,.6)', 10.5, 'center');

    // 说明
    const line = info.phase === 'summer'
      ? '5—9 月盛行西南季风，海水向东北流动，洋流呈顺时针，7、8 月最典型；索马里沿岸深层冷水上泛，形成强大的上升流。'
      : info.phase === 'winter'
        ? '10 月至来年 3、4 月盛行东北季风，海水向西南流动，洋流呈逆时针，12 月、1 月最明显；赤道逆流此时形成。'
        : '转换期：季风正在转向，两支环流都很弱、方向处在交替之中——4 月由冬转夏，10 月由夏转冬。';
    ctx.font = '11px "PingFang SC",sans-serif';
    const maxW = Math.min(geo.w + 40, W - 44);
    const lines = [];
    let cur = '';
    for (const ch of line) {
      if (ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
    lines.forEach((ln, i) => txt(ln, geo.x + geo.w / 2, geo.bot - 30 + i * 15, 'rgba(175,212,232,.82)', 11, 'center'));
  }

  window.addEventListener('resize', () => layout());

  /* ---------- 缩放：滚轮 + 双指 + 单指平移 ---------- */
  function zoomAt(mx, my, k2) {
    const mcx = geo.x + geo.w / 2, mcy = geo.y + geo.h / 2;
    const ux = (mx - (mcx + Z.x)) / Z.k + mcx;
    const uy = (my - (mcy + Z.y)) / Z.k + mcy;
    Z.k = k2;
    Z.x = mx - mcx - (ux - mcx) * k2;
    Z.y = my - mcy - (uy - mcy) * k2;
    const lim = geo.w * (k2 - 1) * 0.5, limY = geo.h * (k2 - 1) * 0.5;
    Z.x = Math.max(-lim, Math.min(lim, Z.x));
    Z.y = Math.max(-limY, Math.min(limY, Z.y));
    draw();
  }
  A.monsoonZoom = () => Z.k;

  const pts = new Map();
  let pinchD = 0, panFrom = null, panMoved = 0;

  cv.addEventListener('wheel', (e) => {
    if (S.mode !== 'monsoon') return;
    e.preventDefault();
    const k2 = Math.max(1, Math.min(3.5, Z.k * (1 - e.deltaY * 0.0016)));
    zoomAt(e.clientX, e.clientY, k2);
  }, { passive: false });

  cv.addEventListener('pointerdown', (e) => {
    if (S.mode !== 'monsoon') return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y);
      panFrom = null;
      return;
    }
    panFrom = { x: e.clientX, y: e.clientY };
    panMoved = 0;
  });

  cv.addEventListener('pointermove', (e) => {
    if (S.mode !== 'monsoon') return;
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchD > 0 && d > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, Math.max(1, Math.min(3.5, Z.k * (d / pinchD))));
      pinchD = d;
      return;
    }
    if (panFrom && Z.k > 1) {
      const dx = e.clientX - panFrom.x, dy = e.clientY - panFrom.y;
      panMoved += Math.abs(dx) + Math.abs(dy);
      if (panMoved > 3) {
        Z.x += dx; Z.y += dy;
        const lim = geo.w * (Z.k - 1) * 0.5, limY = geo.h * (Z.k - 1) * 0.5;
        Z.x = Math.max(-lim, Math.min(lim, Z.x));
        Z.y = Math.max(-limY, Math.min(limY, Z.y));
        panFrom = { x: e.clientX, y: e.clientY };
        draw();
      }
    }
  });

  const up = (e) => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinchD = 0;
    panFrom = null;
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('dblclick', () => { Z.k = 1; Z.x = 0; Z.y = 0; draw(); });   // 双击复位

  A.monsoon = {
    update() { if (S.mode === 'monsoon') draw(); },
    enter() { layout(); draw(); },
    reset() { Z.k = 1; Z.x = 0; Z.y = 0; layout(); draw(); }
  };
  A.monsoonEnter = function () { layout(); draw(); };
})();

</script>
<script>
/* ============ UI / 交互 / 主循环 ============ */
(function () {
  const T = THREE, A = window.APP, S = A.S;

  const panel = document.getElementById('panel');
  const modebar = document.getElementById('modebar');
  const chips = document.getElementById('chips');
  const caption = document.getElementById('caption');
  const card = document.getElementById('card');
  const boot = document.getElementById('boot');

  let host = panel;
  let dragFrom = null;
  // 与样式表里的横屏媒体查询保持一致，否则会走错拖拽逻辑
  const isLandscape = () => window.innerWidth > window.innerHeight &&
    window.innerHeight <= 560 && window.innerWidth <= 1100;
  // 横屏：面板在右侧，收起状态用 body.pmin 表示
  function setPanelMin(v) {
    // 2D 地图固定不动；季风示意图要跟着面板让位/居中
    document.body.classList.toggle('pmin', v);
    if (S.mode === 'monsoon' && A.monsoonEnter) A.monsoonEnter();
  }
  A.setPanelMin = setPanelMin;

  function bindChev(el) {
    const chev = el.querySelector('.chev');
    if (!chev) return;
    chev.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isLandscape()) setPanelMin(!document.body.classList.contains('pmin'));
      else panel.classList.toggle('open');
    });
  }

  function bindDrag(el) {
    el.addEventListener('pointerdown', (e) => {
      if (e.target && e.target.classList && e.target.classList.contains('chev')) return;  // 箭头只点不拖
      dragFrom = {
        x: e.clientX, y: e.clientY,
        land: isLandscape(),
        open: isLandscape() ? !document.body.classList.contains('pmin') : panel.classList.contains('open')
      };
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      panel.style.transition = 'none';
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragFrom) return;
      if (dragFrom.land) {
        const dx = e.clientX - dragFrom.x;
        if (Math.abs(dx) < 2) return;
        const Wd = panel.getBoundingClientRect().width;
        const base = dragFrom.open ? 0 : Wd;
        panel.style.transform = 'translateX(' + Math.max(0, Math.min(Wd, base + dx)) + 'px)';
        return;
      }
      const dy = e.clientY - dragFrom.y;
      if (Math.abs(dy) < 2) return;
      const H = panel.getBoundingClientRect().height;
      const base = dragFrom.open ? 0 : H - 58;
      const y = Math.max(0, Math.min(H - 58, base + dy));
      panel.style.transform = 'translateY(' + y + 'px)';
    });
    const end = (e) => {
      if (!dragFrom) return;
      const dx = e.clientX - dragFrom.x, dy = e.clientY - dragFrom.y;
      panel.style.transition = '';
      panel.style.transform = '';
      if (dragFrom.land) {
        // 跟手拖动后按 1/3 吸附：右拖收起、左拖展开；轻点也是开合
        const Wd = panel.getBoundingClientRect().width || 320;
        if (Math.abs(dx) > 8) setPanelMin(dx > Wd / 3);
        else setPanelMin(!document.body.classList.contains('pmin'));
      } else {
        if (Math.abs(dy) > 26) panel.classList.toggle('open', dy < 0);
        else if (Math.abs(dy) < 6) panel.classList.toggle('open');
      }
      dragFrom = null;
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  const TYPE_CN = { wind: '风海流', dens: '密度流', comp: '补偿流' };
  const MODE_CN = { wind: '风海流', dens: '密度流', comp: '补偿流', globe: '全球洋流', monsoon: '季风洋流' };

  function h(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* ---------------- 全屏 ---------------- */
  (function () {
    const btn = document.getElementById('fs');
    if (!btn) return;
    const el = document.documentElement;
    const isFs = () => document.fullscreenElement || document.webkitFullscreenElement;
    const sync = () => { btn.textContent = isFs() ? '⤢' : '⛶'; };
    btn.onclick = () => {
      if (isFs()) {
        (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
      } else {
        (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
      }
    };
    document.addEventListener('fullscreenchange', () => { sync(); if (A.onResize) A.onResize(); });
    document.addEventListener('webkitfullscreenchange', () => { sync(); if (A.onResize) A.onResize(); });
    sync();
  })();

  /* ---------------- 模式切换 ---------------- */
  const MODES = [
    { id: 'globe', no: '01', name: '全球洋流', sub: '球面 · 平面' },
    { id: 'wind', no: '02', name: '风海流', sub: '风的手指' },
    { id: 'dens', no: '03', name: '密度流', sub: '沉默的门槛' },
    { id: 'comp', no: '04', name: '补偿流', sub: '海的回声' },
    { id: 'monsoon', no: '05', name: '季风洋流', sub: '一年两次反转' }
  ];

  MODES.forEach((m) => {
    const b = h('button', 'mode');
    b.dataset.mode = m.id;
    b.innerHTML = '<i>' + m.no + '</i><b>' + m.name + '</b><span>' + m.sub + '</span>';
    b.onclick = () => setMode(m.id);
    modebar.appendChild(b);
  });

  function setMode(mode) {
    S.mode = mode;
    document.querySelectorAll('.mode').forEach((el) => el.classList.toggle('on', el.dataset.mode === mode));
    const is3D = mode !== 'monsoon' && !(mode === 'globe' && S.gview !== 'globe');
    for (const k in A.scenes) A.scenes[k].visible = (k === mode && is3D);
    document.body.classList.toggle('flat', mode === 'globe' && S.gview !== 'globe');
    document.body.classList.toggle('msn', mode === 'monsoon');
    if (mode === 'comp' && A.comp) {
      if (A.comp.GV) A.comp.GV.visible = S.compKind !== 'h';
      if (A.comp.GH) A.comp.GH.visible = S.compKind === 'h';
    }
    if (mode !== 'monsoon') A.goView(mode === 'comp' ? (S.compKind === 'h' ? 'comph' : 'comp') : mode);
    if (mode !== 'globe') card.classList.remove('show');
    buildPanel();
    if (mode === 'globe') {
      if (S.gview === 'globe') { if (A.globeRefresh) A.globeRefresh(); }
      else if (A.mapEnter) A.mapEnter();
    }
    if (mode === 'monsoon' && A.monsoonEnter) A.monsoonEnter();
    updateCaption();
  }
  A.setMode = setMode;

  A.setGview = function (v) {
    S.gview = (v === 'flat') ? 'flat' : 'globe';
    const on = (S.mode === 'globe' && v === 'globe');
    for (const k in A.scenes) A.scenes[k].visible = (k === 'globe' && on);
    document.body.classList.toggle('flat', v !== 'globe');
    if (v === 'globe') { A.goView('globe'); if (A.globeRefresh) A.globeRefresh(); }
    else if (A.mapEnter) A.mapEnter();
    buildPanel();
    updateCaption();
  };

  /* ---------------- 控件 ---------------- */
  function slider(label, min, max, step, val, fmt, onInput) {
    const wrap = h('div', 'ctl');
    const top = h('div', 'ctl-top');
    top.appendChild(h('span', 'ctl-label', label));
    const v = h('span', 'ctl-val', fmt(val));
    top.appendChild(v);
    wrap.appendChild(top);
    const inp = h('input', 'rng');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = val;
    inp.oninput = () => {
      const x = parseFloat(inp.value);
      v.textContent = fmt(x);
      onInput(x);
      updateCaption();
    };
    wrap.appendChild(inp);
    host.appendChild(wrap);
    return { set: (x) => { inp.value = x; v.textContent = fmt(x); } };
  }

  function toggle(label, on, onClick) {
    const row = h('div', 'ctl row');
    row.appendChild(h('span', 'ctl-label', label));
    const sw = h('button', 'sw' + (on ? ' on' : ''));
    sw.innerHTML = '<i></i>';
    sw.onclick = () => {
      const next = !sw.classList.contains('on');
      sw.classList.toggle('on', next);
      onClick(next);
      updateCaption();
    };
    row.appendChild(sw);
    host.appendChild(row);
    return sw;
  }

  function seg(label, opts, val, onPick, locked) {
    const wrap = h('div', 'ctl');
    wrap.appendChild(h('div', 'ctl-label', label));
    const box = h('div', 'seg' + (locked ? ' locked' : ''));
    opts.forEach((o) => {
      const b = h('button', 'segbtn' + (o.v === val ? ' on' : ''), o.t);
      if (locked) { b.disabled = true; b.classList.add('off'); }
      b.onclick = () => {
        if (locked) return;
        box.querySelectorAll('.segbtn').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        onPick(o.v);
        updateCaption();
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    host.appendChild(wrap);
    return wrap;
  }

  function note(text) {
    const n = h('p', 'note', text);
    host.appendChild(n);
    return n;
  }

  function links(list) {
    const wrap = h('div', 'links');
    wrap.appendChild(h('div', 'ctl-label', '关联洋流 · 点击去全球定位'));
    const box = h('div', 'linkbox');
    list.forEach(([id, name]) => {
      const b = h('button', 'link', name);
      b.onclick = () => A.globeFocus(id);
      box.appendChild(b);
    });
    wrap.appendChild(box);
    host.appendChild(wrap);
  }


  /* ---------------- 月份滚轮（连续拖动） ---------------- */
  const PRESETS = [
    { t: '冬季 1月', m: 1, k: 'winter' },
    { t: '4月 转换', m: 4, k: 'spring' },
    { t: '夏季 7月', m: 7, k: 'summer' },
    { t: '10月 转换', m: 10, k: 'autumn' }
  ];
  let presetRow = null;

  function syncPresets() {
    if (!presetRow) return;
    const info = A.seasonInfo(S.month);
    const hit = info.phase === 'summer' ? 'summer'
      : info.phase === 'winter' ? 'winter'
      : (info.t >= 9 ? 'autumn' : 'spring');
    for (let i = 0; i < presetRow.children.length; i++) {
      presetRow.children[i].classList.toggle('on', PRESETS[i].k === hit);
    }
  }

  // 拖动 / 点击后统一刷新：圆环、预设按钮、字幕、读数
  function syncMonthUI() {
    if (A.wheelDraw) A.wheelDraw();
    syncPresets();
    updateCaption();
  }

  // 筛选组随“着色方式”切换：按成因 → 成因分类；按性质 → 暖流 / 寒流
  function filterSeg(refresh) {
    const cause = [
      { v: 'all', t: '全部' }, { v: 'wind', t: '风海流' },
      { v: 'dens', t: '密度流' }, { v: 'comp', t: '补偿流' }
    ];
    const nature = [{ v: 'all', t: '全部' }, { v: 'warm', t: '暖流' }, { v: 'cold', t: '寒流' }];
    const opts = S.globeColor === 'type' ? cause : nature;
    if (!opts.some((o) => o.v === S.filter)) S.filter = 'all';   // 换维度时回到“全部”
    const wrap = seg('筛选', opts, S.filter, (v) => {
      if (S.sel) return;                 // 选中洋流时不换筛选，免得把它筛没了
      S.filter = v; refresh();
    });
    filterWrap = wrap;
    syncFilterLock();
  }

  // 选中洋流后锁住筛选（不重建面板，避免闪一下）
  let filterWrap = null;
  function syncFilterLock() {
    if (!filterWrap) return;
    const box = filterWrap.querySelector('.seg');
    if (!box) return;
    const locked = !!S.sel;
    box.classList.toggle('locked', locked);
    [...box.querySelectorAll('.segbtn')].forEach((b) => {
      b.disabled = locked;
      b.classList.toggle('off', locked);
    });
    let hint = filterWrap.nextElementSibling;
    const isHint = hint && hint.className === 'lockhint';
    if (locked && !isHint) {
      filterWrap.insertAdjacentElement('afterend',
        h('div', 'lockhint', '已选中洋流，取消选中后才能换筛选'));
    } else if (!locked && isHint) {
      hint.remove();
    }
  }

  const wrapM = (m) => ((m - 1) % 12 + 12) % 12 + 1;
  let wheelVB = null;

  function monthWheel() {
    // 逻辑坐标固定 206×206，横屏时画布放大到 236，整体等比缩放（含字号）
    const L = 206;
    const land = window.innerWidth > window.innerHeight && window.innerHeight < 560;
    // 按面板正文的可用高度决定转盘尺寸，保证整块内容不需要滚动
    let CSS = land ? 168 : 206;
    const sc = CSS / L;
    const H = L;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const wrap = h('div', 'wheelbox');
    const cv = document.createElement('canvas');
    cv.className = 'wheelcv';
    wrap.appendChild(cv);
    host.appendChild(wrap);
    const g = cv.getContext('2d');
    let W = H, cx = H / 2, cy = H / 2;

    // 圆心永远在画布正中；水平居中交给 text-align + inline-block
    function layout() {
      W = L;
      cv.width = Math.round(CSS * dpr);
      cv.height = Math.round(CSS * dpr);
      cv.style.width = CSS + 'px';
      cv.style.height = CSS + 'px';
      cx = L / 2;
      cy = L / 2;
      drawWheel();
    }

    // 月份逆时针排布，于是顺时针拖动圆环时，圆环跟着手指转、月份同时前进
    const angOfMonth = (m) => -((m - S.month) / 12 * Math.PI * 2) - Math.PI / 2;

    // 从 m1 顺时针方向画到 m2（m1 < m2，可跨年）
    function band(m1, m2, col, r0, r1) {
      const s1 = angOfMonth(m1);
      const s2 = m2 > m1 ? s1 - (m2 - m1) / 12 * Math.PI * 2
        : s1 - (m2 - m1 + 12) / 12 * Math.PI * 2;
      g.beginPath();
      g.arc(cx, cy, r1, s1, s2, true);
      g.arc(cx, cy, r0, s2, s1, false);
      g.closePath();
      g.fillStyle = col;
      g.fill();
    }

    function drawWheel() {
      g.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
      g.clearRect(0, 0, W, H);
      const info = A.seasonInfo(S.month);

      // 底环
      g.beginPath(); g.arc(cx, cy, 90, 0, 6.2832);
      g.strokeStyle = 'rgba(120,200,230,.14)'; g.lineWidth = 20; g.stroke();

      // 季节色带：11—3 月冬季，5—9 月夏季，4 月与 10 月为转换期
      const S0 = A.SPRING0, A0 = A.AUTUMN0, L = A.TRANS;
      band(A0 + L, S0, 'rgba(124,200,255,.26)', 80, 100);    // 冬季
      band(S0, S0 + L, 'rgba(185,205,217,.24)', 80, 100);    // 春季转换
      band(S0 + L, A0, 'rgba(255,157,110,.30)', 80, 100);    // 夏季
      band(A0, A0 + L, 'rgba(185,205,217,.24)', 80, 100);    // 秋季转换

      // 当前月份所在扇区
      (function () {
        const m0 = Math.floor(S.month + 0.5);      // 指针最近的那个数字
        const s1 = angOfMonth(m0 - 0.5);          // 数字在格子正中
        const s2 = angOfMonth(m0 + 0.5);
        g.beginPath();
        g.arc(cx, cy, 90, s1, s2, true);
        g.strokeStyle = 'rgba(242,162,74,.30)'; g.lineWidth = 20; g.stroke();
        g.beginPath();
        g.arc(cx, cy, 90, s1, angOfMonth(S.month), true);   // 亮色正好收在指针对应位置
        g.strokeStyle = 'rgba(255,214,160,.92)'; g.lineWidth = 20; g.stroke();
      })();

      // 月份刻度与数字
      for (let m = 1; m <= 12; m++) {
        const a = angOfMonth(m - 0.5);             // 刻度落在两数之间
        const r0 = 78, r1 = 84;
        g.beginPath();
        g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        g.strokeStyle = 'rgba(150,210,235,.45)'; g.lineWidth = 1;
        g.stroke();
        const am = angOfMonth(m);
        const lx = cx + Math.cos(am) * 67, ly = cy + Math.sin(am) * 67;
        const cur = Math.floor(wrapM(S.month + 0.5)) === m;
        g.font = (cur ? '700 12px ' : '500 11.5px ') + '"PingFang SC",sans-serif';
        g.fillStyle = cur ? '#ffd7a8' : 'rgba(190,215,230,.82)';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(String(m), lx, ly);
      }

      // 中心读数
      g.beginPath(); g.arc(cx, cy, 48, 0, 6.2832);
      g.fillStyle = 'rgba(8,20,30,.85)'; g.fill();
      g.strokeStyle = 'rgba(120,200,230,.2)'; g.lineWidth = 1; g.stroke();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = info.tint;
      g.font = '700 26px "PingFang SC",sans-serif';
      const shown = Math.floor(wrapM(S.month + 0.5));
      g.fillText(shown + '月', cx, cy - 4);
      g.font = '500 10.5px "PingFang SC",sans-serif';
      g.fillStyle = 'rgba(180,205,220,.75)';
      g.fillText(info.cn, cx, cy + 16);
      g.font = '400 9.5px "PingFang SC",sans-serif';
      g.fillStyle = 'rgba(150,180,200,.62)';
      g.fillText(info.phase === 'summer' ? '顺时针' : info.phase === 'winter' ? '逆时针' : '转向中', cx, cy + 31);

      // 固定指针
      g.beginPath();
      g.moveTo(cx, cy - 87);
      g.lineTo(cx - 6.5, cy - 98);
      g.lineTo(cx + 6.5, cy - 98);
      g.closePath();
      g.fillStyle = '#ffdca8';
      g.fill();
    }

    const angAt = (e) => {
      const r = cv.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    };

    let dragging = false, last = 0, travel = 0;
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => layout());
      ro.observe(wrap);
    }
    cv.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      dragging = true; last = angAt(e); travel = 0;
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      wrap.classList.add('grab');
    });
    cv.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const a = angAt(e);
      let d = a - last;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      last = a;
      travel += Math.abs(d);
      S.month = wrapM(S.month + d / (Math.PI * 2) * 12);
      drawWheel();
      syncPresets();
      updateCaption();
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      wrap.classList.remove('grab');
      if (travel < 0.05) {                       // 轻点某个数字：直接跳到该月
        const a = angAt(e);
        const m = Math.round(wrapM(S.month - (a + Math.PI / 2) / (Math.PI * 2) * 12));
        S.month = wrapM(m);
        syncMonthUI();
      }
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', () => { dragging = false; wrap.classList.remove('grab'); });

    A.wheelDraw = drawWheel;
    wheelVB = drawWheel;
    layout();               // 先按容器宽度排版，再画第一帧

    // 面板内不允许滚动：容器放不下就逐步缩小转盘
    function shrinkToFit() {
      const hostEl = host;
      for (let i = 0; i < 6; i++) {
        if (hostEl.scrollHeight <= hostEl.clientHeight + 2) break;
        if (CSS <= 112) break;
        CSS = Math.max(112, CSS - 24);
        layout();
      }
    }
    if (window.requestAnimationFrame) requestAnimationFrame(shrinkToFit);
  }

  /* ---------------- 面板 ---------------- */
  function buildPanel() {
    panel.innerHTML = '';
    const handle = h('div', 'phandle');
    handle.innerHTML = '<i class="grab"></i><b>' + MODE_CN[S.mode] + '</b><span class="chev">⌃</span>';
    panel.appendChild(handle);
    bindDrag(handle);
    bindChev(handle);
    const body = h('div', 'pbody');
    body.id = 'pbody';
    panel.appendChild(body);
    host = body;

    const head = h('div', 'phead');
    head.appendChild(h('h3', null, MODE_CN[S.mode]));
    head.appendChild(h('span', 'phint', S.mode === 'globe' ? '点击洋流' : '拖动参数'));
    host.appendChild(head);

    // 这一章用哪个实例来讲
    const SUB = {
      dens: '以直布罗陀海峡密度流为例',
      comp: S.compKind === 'h' ? '以赤道逆流为例' : '以秘鲁寒流为例',
      monsoon: '以北印度洋季风洋流为例'
    };
    if (SUB[S.mode]) host.appendChild(h('div', 'psub', SUB[S.mode]));

    if (S.mode === 'wind') {
      slider('风速', 0, 20, 0.5, S.wind, (v) => v.toFixed(1) + ' m/s', (v) => (S.wind = v));
      slider('地转偏向力（地球自转）', 0, 100, 1, S.rot * 100, (v) => v.toFixed(0) + '%', (v) => (S.rot = v / 100));
      seg('半球', [{ v: '1', t: '北半球（右偏）' }, { v: '-1', t: '南半球（左偏）' }], String(S.hemi), (v) => (S.hemi = parseInt(v, 10)));
      note('盛行风推着表层海水走，地转偏向力又把它拉向右侧（南半球向左）：表层流向偏离风向 45°；越往深处流速越小、偏得越多，整层叠起来就得到与风向成 90° 的净输送。把地转偏向力调到 0%，螺旋与 90° 偏转一起消失。');
      links([['kuro', '日本暖流'], ['npw', '北太平洋暖流'], ['acc', '西风漂流']]);
    }

    if (S.mode === 'dens') {
      slider('盐度差（地中海 − 大西洋）', 0, 4, 0.1, S.sal, (v) => v.toFixed(1) + '‰', (v) => (S.sal = v));
      slider('海槛深度', -28, -8, 0.5, S.sill, (v) => v.toFixed(0) + ' m', (v) => { S.sill = v; A.dens.rebuild(); });
      const bar = h('div', 'gauge');
      bar.innerHTML = '<span>交换强度</span><div class="bar"><i></i></div>';
      host.appendChild(bar);
      A._densBar = bar.querySelector('i');
      note('海槛越浅，高盐水越难翻越；抬到 −10 m 附近，交换几乎中断。');
      links([['gib', '直布罗陀'], ['mand', '曼德海峡']]);
    }

    if (S.mode === 'comp') {
      seg('补偿类型', [
        { v: 'v', t: '垂直补偿 · 上升流' },
        { v: 'h', t: '水平补偿 · 赤道逆流' }
      ], S.compKind, (v) => { if (A.comp) A.comp.setKind(v); buildPanel(); });
      if (S.compKind === 'h') {
        slider('信风强度', 0, 15, 0.5, S.offshore, (v) => v.toFixed(1) + ' m/s', (v) => (S.offshore = v));
        const bar = h('div', 'gauge');
        bar.innerHTML = '<span>东西向补偿强度</span><div class="bar cold"><i></i></div>';
        host.appendChild(bar);
        A._compBar = bar.querySelector('i');
        note('南北赤道暖流把水带向西，赤道海区水位降低；西侧的海水因此自西向东回流补充，形成赤道逆流。');
        links([['ecc', '赤道逆流'], ['guinea', '几内亚暖流']]);
      } else {
        slider('离岸风（东南信风）', 0, 15, 0.5, S.offshore, (v) => v.toFixed(1) + ' m/s', (v) => (S.offshore = v));
        toggle('厄尔尼诺模式', S.elnino, (v) => (S.elnino = v));
        const bar = h('div', 'gauge');
        bar.innerHTML = '<span>上升流强度</span><div class="bar cold"><i></i></div>';
        host.appendChild(bar);
        A._compBar = bar.querySelector('i');
        note('先流走，再补充——注意箭头出现的时间差；这就是“垂直补偿”。');
        links([['peru', '秘鲁寒流'], ['beng', '本格拉寒流']]);
      }
    }

    if (S.mode === 'globe') {
      seg('视图', [{ v: 'globe', t: '3D 地球' }, { v: 'flat', t: '平面地图' }],
        S.gview, (v) => { if (A.setGview) A.setGview(v); });
    }

    if (S.mode === 'map') {
      seg('着色方式', [{ v: 'type', t: '按成因' }, { v: 'nature', t: '按性质' }], S.globeColor, (v) => {
        S.globeColor = v; S.filter = 'all'; buildPanel();
        if (A.globeRefresh) A.globeRefresh();
      });
      filterSeg(() => { if (A.globeRefresh) A.globeRefresh(); });
      const lg = h('div', 'legend oneline tight');
      lg.innerHTML = S.globeColor === 'type'
        ? '<div><i style="background:#f2a24a"></i>风海流</div>' +
          '<div><i style="background:#b46cf0"></i>密度流</div>' +
          '<div><i style="background:#35d0a0"></i>补偿流</div>'
        : '<div><i style="background:#ff7a59"></i>暖流（由低纬流向高纬）</div>' +
          '<div><i style="background:#4fc3ff"></i>寒流（由高纬流向低纬）</div>';
      host.appendChild(lg);
      note('课本视角：线越粗洋流越重要，虚线在流动；点击任意洋流查看成因。');
    }

    if (S.mode === 'globe') {
      seg('着色方式', [{ v: 'type', t: '按成因' }, { v: 'nature', t: '按性质' }], S.globeColor, (v) => {
        S.globeColor = v; S.filter = 'all'; buildPanel(); A.globeRefresh();
      });
      filterSeg(() => A.globeRefresh());
      const lg = h('div', 'legend oneline tight');
      lg.innerHTML = S.globeColor === 'type'
        ? '<div><i style="background:#f2a24a"></i>风海流</div>' +
          '<div><i style="background:#b46cf0"></i>密度流</div>' +
          '<div><i style="background:#35d0a0"></i>补偿流</div>'
        : '<div><i style="background:#ff7a59"></i>暖流（由低纬流向高纬）</div>' +
          '<div><i style="background:#4fc3ff"></i>寒流（由高纬流向低纬）</div>';
      host.appendChild(lg);
      toggle('叠加：四大渔场', S.overlay, (v) => {
        S.overlay = v;
        if (S.gview === 'flat') { if (A.mapEnter) A.mapEnter(); }
        else if (A.globeRefresh) A.globeRefresh();
      });
      note('洋流长度可达上千千米，宽度数百千米，厚度可达数百米乃至一千米以上；成因分类与寒暖性质是两套标签。');
    }

    if (S.mode === 'monsoon') {
      monthWheel();
      // 典型时段：随拖动自动依次点亮
      const row = h('div', 'segrow');
      PRESETS.forEach((p) => {
        const b = h('button', 'segbtn', p.t);
        b.onclick = () => {          // 点一下跳到该时段的代表月
          S.month = p.m;
          syncMonthUI();
        };
        row.appendChild(b);
      });
      host.appendChild(row);
      presetRow = row;
      syncPresets();
      const lg = h('div', 'legend oneline');
      lg.innerHTML =
        '<div><i style="background:#ff7a59"></i>暖流</div>' +
        '<div><i style="background:#4fc3ff"></i>寒流</div>' +
        '<div><i style="background:#7df5b5"></i>赤道逆流</div>';
      host.appendChild(lg);
      note('转动圆环即可连续改变月份：北印度洋的洋流整体转向——5—9月顺时针、11—3月逆时针；3月下旬到5月上旬、9月下旬到11月上旬是转换期，环流最弱。');
      links([['monsoon', '季风洋流'], ['somali', '索马里洋流'], ['ecc', '赤道逆流']]);
    }

  }

  /* ---------------- 字幕 / 读数 ---------------- */
  function updateCaption() {
    let t = '';
    if (S.mode === 'wind') {
      const H = S.hemi > 0 ? '右' : '左';
      t = S.rot < 0.02
        ? '地转偏向力归零：表层海水顺着风走，螺旋消失，净输送与风向重合——45° 和 90° 两个偏角都是地转偏向力造成的。'
        : '盛行风推动表层海水，地转偏向力又持续把它拉向' + H + '侧：表层流向偏离风向 45°，越往深处流速越小、偏得越多；把各层加起来，净输送与风向成 90°（' + (S.hemi > 0 ? '北半球偏右' : '南半球偏左') + '）。';
    } else if (S.mode === 'dens') {
      t = A.dens.strength() < 0.12
        ? '海槛太浅：高盐水翻不过去，两侧水体几乎停止交换。'
        : '地中海又热又咸，密度大——底层重水翻过海槛流进大西洋，表层轻水反向补进来。';
    } else if (S.mode === 'comp' && S.compKind === 'h') {
      t = '南北两支赤道暖流把水带向西，赤道海区水位降低——西侧海水自西向东回流，形成赤道逆流，这是“水平补偿”。';
    } else if (S.mode === 'comp') {
      t = S.elnino
        ? '厄尔尼诺：信风减弱，上升流受抑，营养盐供应中断，渔获骤减。'
        : '离岸风把表层水推走，近岸水位降低，深层冷水被动上涌——渔场就是这样来的。';
    } else if (S.mode === 'monsoon') {
      const info = A.seasonInfo(S.month);
      t = info.phase === 'summer'
        ? '西南季风把海水推向东北，索马里沿岸深层冷水上泛，北印度洋的洋流呈顺时针，7、8 月最典型。'
        : info.phase === 'winter'
          ? '东北季风把海水推回西南，南赤道暖流的北分支与非洲东岸南下的洋流汇合后向东偏转，赤道逆流出现，北印度洋的洋流呈逆时针，12 月、1 月最明显。'
          : info.wind + '，季风正在转向，环流最弱、方向处在交替之中（约一个半月）。';
    } else if (S.mode === 'globe') {
      t = S.sel ? '' : (S.gview === 'flat'
        ? '顺洋流航行省燃料、省时间；寒暖流交汇多海雾、多冰山；洋流也把污染物带向更远的海区。'
        : '拖动地球，点击任意一条洋流，看它属于哪一类成因；也可以按成因筛选或换到平面地图。');
    } else {
      t = S.sel ? '' : '拖动地球，点击任意一条洋流，看它属于哪一类成因；也可以按成因筛选。';
    }
    caption.textContent = t;
    caption.style.opacity = t ? '1' : '0';
  }

  function drawChips() {
    let arr = [];
    if (S.mode === 'wind') {
      const ang = 45 * S.rot;
      const side = S.hemi > 0 ? '右' : '左';
      arr = [
        ['风速', S.wind.toFixed(1) + ' m/s'],
        ['表层偏角', ang < 0.5 ? '0°' : side + ' ' + ang.toFixed(0) + '°'],
        ['净输送偏角', ang < 0.5 ? '0°' : side + ' 90°'],
        ['表层流速', (S.wind * 0.03).toFixed(2) + ' m/s']
      ];
    } else if (S.mode === 'dens') {
      const st = A.dens.strength();
      arr = [
        ['交换强度', (st * 100).toFixed(0) + '%'],
        ['海槛深度', S.sill.toFixed(0) + ' m'],
        ['盐度差', S.sal.toFixed(1) + '‰']
      ];
      if (A._densBar) A._densBar.style.width = Math.round(A.clamp(st, 0, 1) * 100) + '%';
    } else if (S.mode === 'comp' && S.compKind === 'h') {
      const w = S.offshore;
      arr = [
        ['信风', w.toFixed(1) + ' m/s'],
        ['东西补偿', (A.clamp(w / 12, 0, 1) * 100).toFixed(0) + '%'],
        ['流向', '自西向东']
      ];
      if (A._compBar) A._compBar.style.width = Math.round(A.clamp(w / 12, 0, 1) * 100) + '%';
    } else if (S.mode === 'comp') {
      const w = A.comp.windNow();
      arr = [
        ['离岸风', w.toFixed(1) + ' m/s'],
        ['上升流', (A.clamp(w / 12, 0, 1) * 100).toFixed(0) + '%'],
        ['渔获指数', (A.clamp(w / 12, 0, 1) * 100).toFixed(0)]
      ];
      if (A._compBar) A._compBar.style.width = Math.round(A.clamp(w / 12, 0, 1) * 100) + '%';
    } else if (S.mode === 'monsoon') {
      const info = A.seasonInfo(S.month);
      arr = [
        ['月份', Math.floor(wrapM(S.month + 0.5)) + ' 月'],
        ['季风', info.wind],
        ['环流', info.dir]
      ];
    } else {
      const n = A.CUR.filter((c) => A.curVisible(c) && A.curMatch(c)).length;
      arr = [['洋流', n + ' 条'], ['着色', S.globeColor === 'type' ? '按成因' : '按性质'], ['视图', S.gview === 'flat' ? '平面' : '球面']];
    }
    chips.innerHTML = arr.map((a) => '<span class="chip"><em>' + a[0] + '</em>' + a[1] + '</span>').join('');
  }

  /* ---------------- 洋流卡片 ---------------- */
  let cardOpen = false, lastCardId = null;
  A.onSelectCurrent = function (id) {
    syncFilterLock();
    if (!id) { card.classList.remove('show'); lastCardId = null; return; }
    if (id !== lastCardId) { cardOpen = true; lastCardId = id; }   // 新选中时直接展开
    const c = A.CUR.find((x) => x.id === id);
    if (!c) return;
    const col = '#' + (S.globeColor === 'type' ? A.typeColor[c.t] : A.natColor[c.k]).toString(16).padStart(6, '0');
    const nat = c.k === 'warm' ? '暖流' : c.k === 'cold' ? '寒流' : '双层交换';
    card.innerHTML =
      '<div class="cmini"><span class="dot" style="background:' + col + '"></span>' +
      '<b>' + c.n + '</b><em>' + TYPE_CN[c.t] + ' · ' + nat + '</em>' +
      '<button class="x">×</button><button class="ctog">▼</button></div>' +
      '<div class="cbody">' +
      '<p class="why">' + c.why + '</p>' +
      '<p class="eff">' + c.eff + '</p>' +
      '<button class="go">' + (c.link === 'monsoon' ? '看它怎么随季风反转 →' : '看它怎么形成 →') + '</button></div>';
    card.classList.add('show');
    card.classList.toggle('open', cardOpen);
    card.querySelector('.x').onclick = (ev) => { ev.stopPropagation(); A.globeSelect(null, false); };
    card.querySelector('.ctog').onclick = (ev) => {
      ev.stopPropagation();
      cardOpen = !cardOpen;
      card.classList.toggle('open', cardOpen);
    };
    card.querySelector('.cmini').onclick = () => { cardOpen = true; card.classList.add('open'); };
    card.querySelector('.go').onclick = () => A.setMode(c.link);
  };

  /* ---------------- 主循环 ---------------- */
  const clock = new T.Clock();
  let frame = 0;
  const t0 = performance.now();
  let booted = false;

  function tick() {
    requestAnimationFrame(tick);
    const raw = Math.min(clock.getDelta(), 0.06);
    const dt = S.playing ? raw * S.speed : 0;
    S.t += dt;

    const g = A.scenes[S.mode];
    if (g) {
      if (S.mode === 'wind') A.wind.update(dt);
      else if (S.mode === 'dens') A.dens.update(dt);
      else if (S.mode === 'comp') A.comp.update(dt);
      else if (S.mode === 'globe') A.globe.update(dt);
    }
    if (S.mode === 'globe' && S.gview !== 'globe' && A.map2d) A.map2d.update(dt);
    if (S.mode === 'monsoon' && A.monsoon) A.monsoon.update(dt);

    A.updateCamera();
    A.updateLabels();
    A.renderer.render(A.scene, A.camera);

    if (frame % 6 === 0) drawChips();
    frame++;
    if (boot && !booted && performance.now() - t0 > 500) { booted = true; boot.classList.add('gone'); }
  }

  /* ---------------- 启动 ---------------- */
  setMode('globe');
  A.goView('globe', true);
  tick();

  window.addEventListener('keydown', (e) => {
    const map = { '1': 'globe', '2': 'wind', '3': 'dens', '4': 'comp', '5': 'monsoon' };
    if (map[e.key]) setMode(map[e.key]);
    if (e.key === ' ') { S.playing = !S.playing; }
  });
})();

</script>
</body>
</html>
